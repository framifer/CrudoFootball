let rngState=123456789;
function seedRng(seed){rngState=(seed>>>0)||1;}
function rng(){rngState^=rngState<<13;rngState>>>=0;rngState^=rngState>>17;rngState^=rngState<<5;rngState>>>=0;return rngState/4294967296;}

let players=[],ball=null,controlledIdx=0;
const FORMATIONS={"4-4-2":[4,4,2],"4-3-3":[4,3,3],"4-5-1":[4,5,1],"5-3-2":[5,3,2],"5-4-1":[5,4,1],"3-4-3":[3,4,3],"3-5-2":[3,5,2]};

function buildTournament(playerIdx){
  const others=[]; for(let i=0;i<NATIONAL_TEAMS.length;i++){if(i!==playerIdx)others.push(i);}
  for(let k=others.length-1;k>0;k--){const j=rngInt(0,k);const tmp=others[k];others[k]=others[j];others[j]=tmp;}
