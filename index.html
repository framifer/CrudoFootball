      if (kit.pattern === "vstripe") {
        const stripes = 4, sw = w / stripes;
        for (let i = 0; i < stripes; i++) { px(prevX + i * sw, y, Math.ceil(sw), h, (i % 2 === 0) ? kit.c1 : kit.c2); }
      } else if (kit.pattern === "hstripe") {
        const stripes = 3, sh = h / stripes;
        for (let i = 0; i < stripes; i++) { px(prevX, y + i * sh, w, Math.ceil(sh), (i % 2 === 0) ? kit.c1 : kit.c2); }
      } else { px(prevX, y, w, h, kit.c1); }
      px(prevX - 3, y + 1, 3, 6, kit.c1);
      px(prevX + w, y + 1, 3, 6, kit.c1);
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 1;
      ctx.strokeRect(prevX - 3, y, w + 6, h);
    }

    function drawMenu() {
      ctx.fillStyle = "#0d2038";
      ctx.fillRect(0, 0, 320, 320);
      ctx.textAlign = "center";
      ctx.fillStyle = "#dc0000";
      ctx.font = "bold 22px monospace";
      ctx.fillText(t("title"), 160, 44);
      ctx.fillStyle = "#f8d820";
      ctx.font = "bold 12px monospace";
      ctx.fillText(teamName(playerTeam), 160, 68);
      drawBigFootballer(160, 150, 1.1, playerTeam.kit, "idle");
      const items = menuMainItems();
      ctx.font = "bold 15px monospace";
      items.forEach(function (key, idx) {
        const label = t(key);
        const y = 186 + idx * 28;
        if (idx === menuIndex) { ctx.fillStyle = "#00e5ff"; ctx.fillText("> " + label + " <", 160, y); }
        else { ctx.fillStyle = "#aaa"; ctx.fillText(label, 160, y); }
      });
      ctx.fillStyle = "#7ad0ff";
      ctx.font = "bold 9px monospace";
      ctx.fillText(t("langLabel") + ": " + lang.toUpperCase() + " (" + t("toggleLangHint") + ")", 160, 258);
      ctx.fillStyle = "#666";
      ctx.font = "bold 8px monospace";
      ctx.fillText(t("controlsHint"), 160, 272);
      ctx.fillText(t("controlsHint2"), 160, 283);
      ctx.fillText(t("changeTeam"), 160, 294);
      ctx.textAlign = "left";
    }

    function drawOpponentSelect() {
      ctx.fillStyle = "#0d2038";
      ctx.fillRect(0, 0, 320, 320);
      ctx.textAlign = "center";
      ctx.fillStyle = "#f8d820";
      ctx.font = "bold 14px monospace";
      ctx.fillText(t("chooseOpponent"), 160, 24);
      const list = opponentList();
      list.forEach(function (teamIdx, i) {
        const y = 50 + i * 25;
        const team = teamPool[teamIdx];
        const name = teamName(team);
        drawKitSwatch(78, y - 11, team.kit);
        ctx.textAlign = "left";
        ctx.font = "bold 12px monospace";
        ctx.fillStyle = "#ffffff";
        const nameX = 104;
        ctx.fillText(name, nameX, y);
        if (i === menuIndex) {
          const nameW = ctx.measureText(name).width;
          ctx.beginPath();
          ctx.arc(nameX + nameW + 8, y - 4, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
        }
      });
      ctx.textAlign = "center";
      ctx.fillStyle = "#666";
      ctx.font = "bold 9px monospace";
      ctx.fillText(t("navBack"), 160, 306);
      ctx.textAlign = "left";
    }

    function drawFormationSelect() {
      ctx.fillStyle = "#0d2038";
      ctx.fillRect(0, 0, 320, 320);
      ctx.textAlign = "center";
      ctx.fillStyle = "#f8d820";
      ctx.font = "bold 14px monospace";
      ctx.fillText(t("chooseFormation"), 160, 24);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px monospace";
      ctx.fillText(teamName(playerTeam), 160, 42);
      ctx.font = "bold 13px monospace";
      FORMATION_NAMES.forEach(function (name, i) {
        const y = 70 + i * 24;
        ctx.textAlign = "left";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(name, 40, y);
        if (i === formationIndex) {
          const w = ctx.measureText(name).width;
          ctx.beginPath();
          ctx.arc(40 + w + 9, y - 4, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
        }
      });
      drawFormationPreview(FORMATION_NAMES[formationIndex], 210, 66, 90, 180);
      ctx.textAlign = "center";
      ctx.fillStyle = "#666";
      ctx.font = "bold 9px monospace";
      ctx.fillText(t("navTeamHint"), 160, 306);
      ctx.textAlign = "left";
    }

    function drawFormationPreview(name, bx, by, bw, bh) {
      px(bx, by, bw, bh, "#279a3d");
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.beginPath();
      ctx.moveTo(bx, by + bh / 2);
      ctx.lineTo(bx + bw, by + bh / 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(bx + bw / 2, by + bh / 2, 10, 0, Math.PI * 2);
      ctx.stroke();
      const form = buildFormation(name);
      const kit = playerTeam.kit;
      form.forEach(function (pl) {
        const px_ = bx + pl.fy * bw;
        const py_ = by + bh - (pl.fx * bh * 1.8);
        ctx.fillStyle = (pl.role === "gk") ? "#ffe23a" : kit.c1;
        ctx.beginPath();
        ctx.arc(px_, Math.max(by + 4, Math.min(by + bh - 4, py_)), 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.stroke();
      });
    }

    function drawPrerace() {
      ctx.fillStyle = "#0d2038";
      ctx.fillRect(0, 0, 320, 320);
      ctx.textAlign = "center";
      ctx.fillStyle = "#f8d820";
      ctx.font = "bold 15px monospace";
      ctx.fillText(t("championship"), 160, 30);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px monospace";
      ctx.fillText(t("matchDay") + " " + (championshipRound + 1) + " " + t("of") + " " + CHAMP_TOTAL, 160, 52);
      const fx = currentFixture();
      if (!fx) { ctx.textAlign = "left"; return; }
      const opp = teamPool[fx.opponent];
      ctx.fillStyle = "#00e5ff";
      ctx.font = "bold 13px monospace";
      const vsLine = fx.home ? (teamName(playerTeam) + " vs " + teamName(opp)) : (teamName(opp) + " vs " + teamName(playerTeam));
      ctx.fillText(vsLine, 160, 76);
      drawKitSwatch(112, 86, playerTeam.kit);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 10px monospace";
      ctx.fillText("-", 160, 98);
      drawKitSwatch(188, 86, opp.kit);
      const items = preraceItems();
      ctx.font = "bold 13px monospace";
      items.forEach(function (key, idx) {
        const label = t(key);
        const y = 142 + idx * 28;
        if (idx === preraceIndex) { ctx.fillStyle = "#00e5ff"; ctx.fillText("> " + label + " <", 160, y); }
        else { ctx.fillStyle = "#bbb"; ctx.fillText(label, 160, y); }
      });
      if (saveFlashMs > 0) { ctx.fillStyle = "#00ff88"; ctx.font = "bold 11px monospace"; ctx.fillText(t("savedOk"), 160, 288); }
      ctx.fillStyle = "#666";
      ctx.font = "bold 9px monospace";
      ctx.fillText(t("navChoose"), 160, 306);
      ctx.textAlign = "left";
    }

    function drawStandings() {
      ctx.fillStyle = "#0c1020";
      ctx.fillRect(0, 0, 320, 320);
      ctx.textAlign = "center";
      ctx.fillStyle = "#f8d820";
      ctx.font = "bold 13px monospace";
      const last = (championshipRound >= CHAMP_TOTAL - 1) && (standingsReturn === "ADVANCE");
      ctx.fillText(last ? t("finalStandings") : t("standings"), 160, 16);
      ctx.font = "bold 8px monospace";
      ctx.fillStyle = "#8898b8";
      ctx.textAlign = "left";
      ctx.fillText("#", 14, 30);
      ctx.textAlign = "right";
      ctx.fillText(t("played"), 216, 30);
      ctx.fillText("GF", 250, 30);
      ctx.fillText("GS", 280, 30);
      ctx.fillText(t("pts"), 312, 30);
      const sorted = sortedStandings();
      ctx.font = "bold 9px monospace";
      sorted.forEach(function (s, idx) {
        const y = 44 + idx * 14;
        ctx.textAlign = "left";
        px(14, y - 7, 8, 8, s.kit.c1);
        if (s.kit.pattern !== "solid") px(18, y - 7, 4, 8, s.kit.c2);
        ctx.fillStyle = s.isPlayer ? "#00e5ff" : "#ddd";
        ctx.fillText((idx + 1).toString().padStart(2, " ") + ". " + abbr(s.name), 26, y);
        ctx.textAlign = "right";
        ctx.fillStyle = s.isPlayer ? "#00e5ff" : "#bbb";
        ctx.fillText(String(s.played), 216, y);
        ctx.fillText(String(s.gf), 250, y);
        ctx.fillText(String(s.ga), 280, y);
        ctx.fillStyle = s.isPlayer ? "#00e5ff" : "#fff";
        ctx.fillText(String(s.points), 312, y);
      });
      ctx.textAlign = "center";
      ctx.fillStyle = "#888";
      ctx.font = "bold 9px monospace";
      ctx.fillText(t("continueA"), 160, 314);
      ctx.textAlign = "left";
    }

    function drawPodium() {
      const bgTop = (finalRank === 1) ? "#1a2a5a" : "#141830";
      px(0, 0, 320, 320, bgTop);
      for (let i = 0; i < 30; i++) {
        const cx = (i * 97 + Math.floor(splashTime / 30) * (i % 3 + 1)) % 320;
        const cy = (i * 53 + Math.floor(splashTime / 20) * (i % 2 + 1)) % 260 + 10;
        const colors = ["#ffd84a", "#ff5555", "#44ddaa", "#8844ff", "#ffffff"];
        px(cx, cy, 3, 3, colors[i % colors.length]);
      }
      ctx.textAlign = "center";
      let titleColor, titleText, msgText;
      if (finalRank === 1) { titleColor = "#ffd84a"; titleText = t("podiumWin"); msgText = t("podiumWinMsg"); }
      else if (finalRank === 2) { titleColor = "#c8c8d0"; titleText = t("podiumSecond"); msgText = t("podiumSecondMsg"); }
      else { titleColor = "#cd7f32"; titleText = t("podiumThird"); msgText = t("podiumThirdMsg"); }
      ctx.fillStyle = titleColor;
      ctx.font = "bold 22px monospace";
      ctx.fillText(titleText, 160, 40);
      const baseY = 250;
      px(70, baseY - 40, 50, 40, "#b8b8c0");
      px(70, baseY - 40, 50, 4, "#d8d8e0");
      ctx.fillStyle = "#333"; ctx.font = "bold 16px monospace"; ctx.fillText("2", 95, baseY - 18);
      px(135, baseY - 62, 50, 62, "#f0c000");
      px(135, baseY - 62, 50, 4, "#ffe070");
      ctx.fillStyle = "#5a4400"; ctx.fillText("1", 160, baseY - 38);
      px(200, baseY - 26, 50, 26, "#cd7f32");
      px(200, baseY - 26, 50, 4, "#e0a050");
      ctx.fillStyle = "#3a2410"; ctx.fillText("3", 225, baseY - 10);
      let manX, manBaseY;
      if (finalRank === 1) { manX = 160; manBaseY = baseY - 62; }
      else if (finalRank === 2) { manX = 95; manBaseY = baseY - 40; }
      else { manX = 225; manBaseY = baseY - 26; }
      drawBigFootballer(manX, manBaseY, 0.95, playerTeam.kit, "celebrate");
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px monospace";
      wrapText(msgText, 160, 278, 300, 15);
      ctx.fillStyle = "#888";
      ctx.font = "bold 9px monospace";
      ctx.fillText(t("continueA"), 160, 312);
      ctx.textAlign = "left";
    }

    let lastTime = performance.now();

    function gameLoop(now) {
      let dt = now - lastTime;
      lastTime = now;
      if (dt > 100) dt = 100;
      try { update(dt); draw(); } catch (err) { console.error(err); }
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
