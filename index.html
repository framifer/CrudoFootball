<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crudo Football</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
:root { --gb-body: #c4cfa1; }
body { background-color:#111; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Courier New', monospace; }
#phone-screen { width:100vw; max-width:420px; height:100vh; max-height:900px; background-color:var(--gb-body); display:flex; flex-direction:column; border:2px solid #2a2a2a; border-radius:26px 26px 44px 44px; box-shadow:0 0 30px rgba(0,0,0,0.9), inset 0 0 8px rgba(255,255,255,0.15); overflow:hidden; }
#screen-container { flex:0 0 46%; background-color:#222; display:flex; justify-content:center; align-items:center; padding:12px; }
#game-wrapper { position:relative; width:320px; height:320px; max-width:100%; aspect-ratio:1/1; margin:0 auto; border:4px solid #111; border-radius:8px; background-color:#000; box-shadow:inset 0 0 12px rgba(0,0,0,0.7); }
canvas { display:block; width:100%; height:100%; image-rendering:pixelated; border-radius:4px; }
#controller { flex:1; background-color:var(--gb-body); display:flex; flex-direction:column; justify-content:space-between; padding:30px 18px 40px; border-top:4px solid #555; }
.controls-top { display:flex; justify-content:space-between; align-items:flex-start; width:100%; padding:0 4px; }
.dpad { position:relative; width:210px; height:210px; flex-shrink:0; border-radius:50%; background:radial-gradient(circle at 42% 38%, #2c2c2c, #0c0c0c 78%); box-shadow:0 6px 10px rgba(0,0,0,0.5), inset 2px 2px 4px rgba(255,255,255,0.08), inset -3px -3px 8px rgba(0,0,0,0.9); touch-action:none; -webkit-tap-highlight-color:transparent; cursor:pointer; }
.dpad::before, .dpad::after { content:""; position:absolute; background:linear-gradient(145deg, #3a3a3a, #161616); box-shadow:inset 1px 1px 2px rgba(255,255,255,0.15), inset -1px -1px 3px rgba(0,0,0,0.8); border-radius:11px; }
.dpad::before { top:28px; bottom:28px; left:50%; width:58px; transform:translateX(-50%); }
.dpad::after { left:28px; right:28px; top:50%; height:58px; transform:translateY(-50%); }
.dpad-btn { display:none; }
.dpad.active { box-shadow:0 4px 6px rgba(0,0,0,0.5), inset 3px 3px 6px rgba(0,0,0,0.9); }
.dpad-glow { position:absolute; width:66px; height:66px; left:50%; top:50%; margin-left:-33px; margin-top:-33px; border-radius:50%; background:radial-gradient(circle, rgba(120,205,255,0.55) 0%, rgba(90,150,220,0.28) 45%, rgba(0,0,0,0) 72%); box-shadow:0 0 14px rgba(120,205,255,0.5), inset 0 0 8px rgba(0,0,0,0.6); pointer-events:none; opacity:0; transition:opacity 0.08s ease, transform 0.06s ease; z-index:5; }
.dpad.active .dpad-glow { opacity:1; }
.action-buttons { display:flex; align-items:flex-start; gap:20px; margin-right:40px; filter:drop-shadow(3px 6px 5px rgba(0,0,0,0.3)); }
.btn-round-container { text-align:center; }
.btn-b-container { margin-top:150px; }
.btn-a-container { margin-top:70px; }
.btn-round { width:74px; height:74px; background:linear-gradient(145deg, #a72352, #6e1333); border-radius:50%; border:none; color:white; font-weight:bold; font-size:25px; cursor:pointer; box-shadow:inset 1px 2px 3px rgba(255,255,255,0.3), inset -2px -2px 5px rgba(0,0,0,0.6); transition:transform 0.05s ease; touch-action:none; -webkit-tap-highlight-color:transparent; }
.btn-round:active, .btn-round.active { transform:translate(2px,3px); box-shadow:inset 2px 2px 7px rgba(0,0,0,0.8); background:#5b0f2a; }
.controls-bottom { display:flex; justify-content:center; gap:45px; margin-top:0; margin-bottom:40px; }
.btn-pill-container { text-align:center; transform:rotate(-25deg); filter:drop-shadow(2px 4px 3px rgba(0,0,0,0.3)); }
.btn-pill { width:88px; height:23px; background:linear-gradient(145deg, #6e6e6e, #333); border-radius:12px; border:none; cursor:pointer; box-shadow:inset 1px 1px 2px rgba(255,255,255,0.2), inset -1px -1px 3px rgba(0,0,0,0.7); touch-action:none; -webkit-tap-highlight-color:transparent; }
.btn-pill:active, .btn-pill.active { transform:translate(1px,2px); background:#222; box-shadow:inset 1px 1px 4px rgba(0,0,0,0.9); }
.btn-pill-label { font-size:12px; color:#306230; text-align:center; margin-top:6px; font-weight:bold; letter-spacing:1px; }
</style>
</head>

function drawCrest(type,cx,cy,r,shape){

function musicTickStep(){ if(!musicOn){stopMusic();return;} const lead=MUSIC_LEAD[musicStep%MUSIC_LEAD.length]; const bass=MUSIC_BASS[musicStep%MUSIC_BASS.length]; musicNote(lead,"triangle",0.55,0.5); if(musicStep%2===0)musicNote(bass,"sine",0.7,0.6); musicStep=(musicStep+1)%MUSIC_LEAD.length; }

// Calendario round-robin andata+ritorno (11 squadre -> 20 giornate, ognuno jolly a turno).
function buildFixtures(teams){
  const N=teams.length; const arr=teams.map(function(x){return x.uid;});
  // se dispari aggiungi BYE
  const list=arr.slice(); if(list.length%2===1)list.push(null);
  const n=list.length,rounds=n-1,half=n/2,legs=[];
  const rot=list.slice();
  for(let r=0;r<rounds;r++){const round=[];for(let i=0;i<half;i++){const h=rot[i],a=rot[n-1-i];if(h!==null&&a!==null)round.push({h:h,a:a,hg:-1,ag:-1,played:false});}legs.push(round);const fixed=rot[0];const rest=rot.slice(1);rest.unshift(rest.pop());rot.splice(0,rot.length,fixed,...rest);}
  const second=legs.map(function(rd){return rd.map(function(m){return {h:m.a,a:m.h,hg:-1,ag:-1,played:false};});});
  return legs.concat(second);
}
function makeLeague(defIdx,teams){return {defIdx:defIdx,teams:teams,table:newTable(teams),fixtures:buildFixtures(teams),round:0};}
function startNewCareer(playerLeagueIdx,playerTeamUid,kitSpec){

// obiettivo stagionale: dipende dalla lega e da quante stagioni consecutive ci sei (seasonsInLeague, 1-based)
// tipi: {type:"top",n}=arriva nei primi n | {type:"safe"}=non retrocedere | {type:"win"}=vinci il titolo
function objectiveForLeague(lvl,seasonsInLeague){
  const s=seasonsInLeague||1;
  if(lvl===0){ return (s===1)?{type:"top",n:6}:{type:"top",n:3}; }
  if(lvl===1){ return (s===1)?{type:"safe"}:{type:"top",n:3}; }
  // National (lvl 2): 1a=non retrocedere, 2a=primi 3, 3a+=vinci
  if(s===1)return {type:"safe"};
  if(s===2)return {type:"top",n:3};
  return {type:"win",n:1};
}
function objectiveText(obj){
  if(!obj)return "";
  if(obj.type==="win")return t("objWin");
  if(obj.type==="safe")return t("objSafe");

}

function ensureCareerFields(){

function leagueSortedTable(lg){
  const arr=Object.values(lg.table);
  arr.sort(function(x,y){if(y.pts!==x.pts)return y.pts-x.pts;const dx=x.gf-x.gs,dy=y.gf-y.gs;if(dy!==dx)return dy-dx;return y.gf-x.gf;});

function leagueApply(lg,hUid,aUid,hg,ag){const th=lg.table[hUid],ta=lg.table[aUid];if(!th||!ta)return;th.pg++;ta.pg++;th.gf+=hg;th.gs+=ag;ta.gf+=ag;ta.gs+=hg;if(hg>ag){th.v++;th.pts+=3;ta.s++;}else if(hg<ag){ta.v++;ta.pts+=3;th.s++;}else{th.n++;ta.n++;th.pts+=1;ta.pts+=1;}}
function leagueCurRound(lg){return lg.fixtures[lg.round]||null;}
function playerFixture(){const lg=curLeague();const rd=leagueCurRound(lg);if(!rd)return null;for(const m of rd){if(!m.played&&(m.h===career.playerUid||m.a===career.playerUid))return m;}return null;}
function leagueDone(lg){return lg.round>=lg.fixtures.length;}
function simOthersInRound(lg){const rd=leagueCurRound(lg);if(!rd)return;for(const m of rd){if(m.played)continue;if(m.h===career.playerUid||m.a===career.playerUid)continue;const hg=rngInt(0,4),ag=rngInt(0,4);m.hg=hg;m.ag=ag;m.played=true;leagueApply(lg,m.h,m.a,hg,ag);}}
// simula per intero una lega NON del giocatore (per classifica finale stagione)

// registra il risultato della partita del giocatore e avanza la giornata
function careerRecordResult(myGoals,oppGoals){
  const lg=curLeague();const m=playerFixture();if(!m)return;
  let hg,ag;if(m.h===career.playerUid){hg=myGoals;ag=oppGoals;}else{hg=oppGoals;ag=myGoals;}
  m.hg=hg;m.ag=ag;m.played=true;leagueApply(lg,m.h,m.a,hg,ag);
  // INCASSO: introito base della lega (casa/trasferta) * moltiplicatore stadio + bonus vittoria
  const inc=LEAGUE_INCOME[career.leagueLevel]||LEAGUE_INCOME[0];
  let gate=(playerIsHome?inc.home:inc.away)*stadiumIncomeMult(career.stadiumTier||0);
  if(myGoals>oppGoals)gate+=inc.win;
  career.budget=Math.round((career.budget||0)+gate);
  // MORALE: vittoria +12, pareggio +2, sconfitta -5 (0..100)
  let dMor;if(myGoals>oppGoals)dMor=12;else if(myGoals===oppGoals)dMor=2;else dMor=-5;
  career.morale=Math.max(0,Math.min(100,(career.morale||50)+dMor));

  simOthersInRound(lg);lg.round++;
  saveCareer();
}
// Fine stagione: simula le altre leghe, calcola promo/retro tra le 3 leghe scambiando
// 3 squadre alla volta, determina la sorte del giocatore e prepara la nuova stagione.
function finishSeason(){
  const L=career.leagues; const lvl=career.leagueLevel;
  // simula per intero le leghe non giocate dal giocatore (quella del giocatore e' gia finita)
  for(let d=0;d<3;d++){ if(d!==lvl) simEntireLeague(L[d]); }
  // classifiche finali (array di uid ordinati)
  const order=[leagueSortedTable(L[0]),leagueSortedTable(L[1]),leagueSortedTable(L[2])];
  // posizione del giocatore nella sua lega
  const playerRank=order[lvl].findIndex(function(r){return r.uid===career.playerUid;}); // 0-based
  // determina esito giocatore
  let outcome="stayed";
  if(lvl===2){ if(playerRank===0){outcome="won";} else if(playerRank>=order[2].length-3){outcome="relegated";} }
  else if(lvl===0){ if(playerRank<3){outcome="promoted";} }
  else { if(playerRank<3){outcome="promoted";} else if(playerRank>=order[1].length-3){outcome="relegated";} }
  promoOutcome=outcome;
  // --- OBIETTIVO STAGIONALE: valutazione ed effetto sulla stagione successiva ---
  const rank1=playerRank+1; // posizione 1-based
  const obj=career.objective||objectiveForLeague(lvl,career.leagueSeasons);
  if(obj.type==="win")objectiveMet=(rank1===1);
  else if(obj.type==="safe")objectiveMet=(outcome!=="relegated");
  else objectiveMet=(rank1<=obj.n);
  objectiveActive=true;
  const nextMod=objectiveMet?1.08:0.92;
  // --- STORICO: registro la stagione conclusa ---
  const meTeam=teamByUid(L[lvl],career.playerUid);
  career.history.push({season:career.season,lvl:lvl,pos:rank1,outcome:outcome,teamEn:meTeam?meTeam.en:"?",teamIt:meTeam?meTeam.it:"?",objMet:objectiveMet});
  if(outcome==="won"){
    // schermata fine campionato (National): campione + 3 retrocesse in Interregional
    const allT0={}; L.forEach(function(lg){lg.teams.forEach(function(tm){allT0[tm.uid]=tm;});});
    function nm(uid){const t2=allT0[uid];return t2?{en:t2.en,it:t2.it}:{en:"?",it:"?"};}
    const champUid=order[2][0].uid;
    const relN=order[2].slice(order[2].length-3).map(function(r){return nm(r.uid);});
    career.endMovements={lvl:2,champion:nm(champUid),promoted:[],relegated:relN};
    // dopo la vittoria il giocatore resta in National: la nuova stagione porta 3 promosse dall'Inter
    const promoUp=order[1].slice(0,3).map(function(r){return nm(r.uid);});
    career.startMovements={lvl:2,promoted:promoUp,relegated:[]};
    career.strengthMod=nextMod; career.nationalTitles=(career.nationalTitles||0)+1; career.intlCupUnlocked=true; career.season++; career.leagueSeasons=(career.leagueSeasons||1)+1; career.objective=objectiveForLeague(career.leagueLevel,career.leagueSeasons); saveCareer(); return; }
  // --- scambi promo/retro tra leghe adiacenti (top3 salgono, bottom3 scendono) ---
  // costruisci nuovo elenco squadre per ciascuna lega partendo dagli uid ordinati
  function topN(o,n){return o.slice(0,n).map(function(r){return r.uid;});}
  function botN(o,n){return o.slice(o.length-n).map(function(r){return r.uid;});}
  const up01=topN(order[0],3), down10=botN(order[1],3);      // L0<->L1
  const up12=topN(order[1],3), down21=botN(order[2],3);      // L1<->L2
  // helper: raccogli tutti gli oggetti team per uid da qualsiasi lega
  const allTeams={}; L.forEach(function(lg){lg.teams.forEach(function(tm){allTeams[tm.uid]=tm;});});
  // nuova composizione:
  // L0: (L0 tranne up01) + down10
  const l0uids=order[0].map(function(r){return r.uid;}).filter(function(u){return up01.indexOf(u)<0;}).concat(down10);
  // L2: (L2 tranne down21) + up12
  const l2uids=order[2].map(function(r){return r.uid;}).filter(function(u){return down21.indexOf(u)<0;}).concat(up12);
  // L1: (L1 tranne up12 e down10) + up01 + down21
  const l1uids=order[1].map(function(r){return r.uid;}).filter(function(u){return up12.indexOf(u)<0&&down10.indexOf(u)<0;}).concat(up01).concat(down21);
  function rebuild(defIdx,uids){const teams=uids.map(function(u){return allTeams[u];});return makeLeague(defIdx,teams);}
  career.leagues=[rebuild(0,l0uids),rebuild(1,l1uids),rebuild(2,l2uids)];
  // --- REGISTRO MOVIMENTI per le schermate fine/inizio campionato ---
  function nm(uid){const t2=allTeams[uid];return t2?{en:t2.en,it:t2.it}:{en:"?",it:"?"};}
  // per lega: chi sale (verso la lega superiore) e chi scende (verso la inferiore)
  const upByLeague=[up01,up12,[]];       // L0->L1, L1->L2, L2->(nessuna)
  const downByLeague=[[],down10,down21]; // L0->(nessuna), L1->L0, L2->L1
  // FINE CAMPIONATO: relativo alla lega appena giocata (lvl)
  career.endMovements={lvl:lvl,champion:null,
    promoted:upByLeague[lvl].map(nm),
    relegated:downByLeague[lvl].map(nm)};
  // aggiorna il livello del giocatore
  if(outcome==="promoted")career.leagueLevel=lvl+1;
  else if(outcome==="relegated")career.leagueLevel=lvl-1;
  // INIZIO CAMPIONATO: relativo alla NUOVA lega del giocatore (chi e' appena entrato)
  const nl=career.leagueLevel;
  const enteredUp=(nl>0)?upByLeague[nl-1]:[];     // saliti da sotto nella nuova lega
  const enteredDown=(nl<2)?downByLeague[nl+1]:[]; // scesi da sopra nella nuova lega
  career.startMovements={lvl:nl,promoted:enteredUp.map(nm),relegated:enteredDown.map(nm)};
  career.season++;
  career.strengthMod=nextMod;
  // stagioni consecutive nella lega attuale: reset a 1 se ho cambiato lega, altrimenti +1
  if(outcome==="promoted"||outcome==="relegated")career.leagueSeasons=1;
  else career.leagueSeasons=(career.leagueSeasons||1)+1;
  career.objective=objectiveForLeague(career.leagueLevel,career.leagueSeasons);
  saveCareer();
}
// ---- Colori maglia per la partita ----
// il giocatore usa sempre career.kitColId (o playerKit gia' impostato in singola).
// l'avversario prende un colore casuale != quello del giocatore.
function colorRgb(hex){const n=parseInt(hex.slice(1),16);return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function colorDistance(h1,h2){const a=colorRgb(h1),b=colorRgb(h2);const dr=a.r-b.r,dg=a.g-b.g,db=a.b-b.b;return Math.sqrt(dr*dr+dg*dg+db*db);}
function randomOppKitColId(playerColId){
  return randomOppKitColIdAvoid(playerColId,null);
}
// come sopra ma evita anche 'avoidColId' (es. l'ultimo colore avversario usato) per non ripeterlo
function randomOppKitColIdAvoid(playerColId,avoidColId){
  const myKc=KIT_COLORS.find(function(k){return k.id===playerColId;})||KIT_COLORS[0];
  // escludi: colore del giocatore, colori troppo simili al mio, e (se possibile) l'ultimo avversario
  let pool=KIT_COLORS.filter(function(k){
    if(k.id===playerColId)return false;
    if(colorDistance(k.c,myKc.c)<90)return false;
    if(avoidColId&&k.id===avoidColId)return false;
    return true;
  });
  // fallback progressivi se il filtro e' troppo restrittivo
  if(pool.length===0)pool=KIT_COLORS.filter(function(k){return k.id!==playerColId&&colorDistance(k.c,myKc.c)>=90;});
  if(pool.length===0)pool=KIT_COLORS.filter(function(k){return k.id!==playerColId;});
  return pool[rngInt(0,pool.length-1)].id;
}
// colori "abbastanza distinti" da un hex di riferimento
function colorsDistinctFrom(hex,minDist){
  return KIT_COLORS.filter(function(k){return colorDistance(k.c,hex)>=minDist;});
}
// Genera una spec maglia per l'avversario:
//  - pattern casuale (righe ~40%, tinta unita ~60%)
//  - abbastanza diversa dai colori della mia maglia
//  - firma (sig) diversa dalla mia e da 'avoidSig' (ultima avversaria) per non ripetersi
function randomOppKitSpec(myKitSpec, avoidSig){
  const mySig=kitSig(myKitSpec);
  const myPrimHex=hexForColId(myKitSpec?myKitSpec.c1:"blue");
  for(let attempt=0;attempt<40;attempt++){
    const stripes=(rng()<0.4);
    if(stripes){
      const poolA=colorsDistinctFrom(myPrimHex,70);const baseA=poolA.length?poolA:KIT_COLORS;
      const a=baseA[rngInt(0,baseA.length-1)];
      const poolB=KIT_COLORS.filter(function(k){return k.id!==a.id&&colorDistance(k.c,a.c)>=90;});
      if(poolB.length===0)continue;
      const b=poolB[rngInt(0,poolB.length-1)];
      const spec={pattern:"stripes",c1:a.id,c2:b.id};
      const sig=kitSig(spec);
      if(sig!==mySig&&sig!==avoidSig)return spec;
    } else {
      const pool=colorsDistinctFrom(myPrimHex,90).filter(function(k){return k.id!==(myKitSpec?myKitSpec.c1:null);});
      const base=pool.length?pool:KIT_COLORS.filter(function(k){return k.id!==(myKitSpec?myKitSpec.c1:null);});
      if(base.length===0)continue;
      const c=base[rngInt(0,base.length-1)];
      const spec={pattern:"solid",c1:c.id,c2:c.id};
      const sig=kitSig(spec);
      if(sig!==mySig&&sig!==avoidSig)return spec;
    }
  }
  // fallback: una tinta unita qualsiasi diversa dal mio colore
  const fb=KIT_COLORS.filter(function(k){return k.id!==(myKitSpec?myKitSpec.c1:null);});
  const c=fb[rngInt(0,fb.length-1)];
  return {pattern:"solid",c1:c.id,c2:c.id};
}

function makeCupTeam(idx){

function buildRulesLines(){
  const src=RULES_TEXT[lang]||RULES_TEXT.en;const maxW=296;const out=[];
  ctx.font="bold 9px monospace";
  for(let i=0;i<src.length;i++){const para=src[i];
    if(para===""){out.push("");continue;}
    const words=para.split(" ");let line="";
    for(let w=0;w<words.length;w++){const test=line?(line+" "+words[w]):words[w];
      if(ctx.measureText(test).width>maxW&&line){out.push(line);line=words[w];}else{line=test;}}
    if(line)out.push(line);
  }
  return out;
}

function upcomingPlayerMatches(maxN){
  const lg=curLeague();const out=[];
  for(let r=lg.round;r<lg.fixtures.length&&out.length<maxN;r++){
    const rd=lg.fixtures[r];if(!rd)continue;
    for(const m of rd){ if(!m.played&&(m.h===career.playerUid||m.a===career.playerUid)){ out.push({round:r,m:m}); break; } }
  }
  return out;
}

    const bx=16,bw=230,bh=9,by=y+8;px(bx,by,bw,bh,"#20304a");const fw=Math.round(bw*v/100);const c=(v>=80)?"#00ff88":(v>=50)?"#f2c11e":"#ff9a9a";px(bx,by,fw,bh,c);ctx.strokeStyle="#0a1424";ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle="#ffffff";ctx.font="bold 9px monospace";ctx.fillText(Math.round(v)+"/100",bx+bw+6,by+8);
  }
  ctx.textAlign="center";ctx.fillStyle="#666";ctx.font="bold 9px monospace";ctx.fillText(t("navBack"),160,314);ctx.textAlign="left";
}
function drawMarket(){
  ctx.fillStyle="#0c1730";ctx.fillRect(0,0,320,320);ctx.textAlign="center";
  ctx.fillStyle="#f8d820";ctx.font="bold 15px monospace";ctx.fillText(t("marketMenu"),160,20);
  const open=marketWindowOpen();
  ctx.fillStyle=open?"#00ff88":"#ff6060";ctx.font="bold 10px monospace";ctx.fillText(open?t("marketOpen"):t("marketClosed"),160,36);
  ctx.fillStyle="#8ecdff";ctx.font="bold 8px monospace";ctx.fillText(t("marketWindows"),160,48);
  ctx.fillStyle="#ffd84a";ctx.font="bold 9px monospace";ctx.fillText(t("budget")+": $"+(career.budget||0),160,60);
  const items=squadItems();const sel=((menuIndex%items.length)+items.length)%items.length;
  for(let i=0;i<items.length;i++){
    const k=items[i];const v=career.squad[k];const y=86+i*44;const isSel=(i===sel);
    ctx.textAlign="left";ctx.fillStyle=isSel?"#00e5ff":"#dddddd";ctx.font="bold 11px monospace";
    ctx.fillText((isSel?"> ":"  ")+squadKeyLabel(k),16,y);
    const bx=16,bw=180,bh=8,by=y+6;px(bx,by,bw,bh,"#20304a");const fw=Math.round(bw*v/100);const c=(v>=80)?"#00ff88":(v>=50)?"#f2c11e":"#ff9a9a";px(bx,by,fw,bh,c);ctx.strokeStyle="#0a1424";ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle="#ffffff";ctx.font="bold 9px monospace";ctx.fillText(Math.round(v)+"/100",bx+bw+6,by+8);
    ctx.textAlign="right";
    if(v>=100){ctx.fillStyle="#ffd84a";ctx.fillText(t("maxSquad"),304,y);}
    else{const cost=marketCost(v);const afford=open&&(career.budget||0)>=cost;ctx.fillStyle=afford?"#8effc0":(open?"#ff6060":"#777");ctx.fillText("$"+cost,304,y);}
    ctx.textAlign="left";
  }
  ctx.textAlign="center";
  if(open){ctx.fillStyle="#00e5ff";ctx.font="bold 9px monospace";ctx.fillText(t("buy5")+"   (+5%)",160,300);}
  else{ctx.fillStyle="#ff9a9a";ctx.font="bold 9px monospace";ctx.fillText(t("marketClosed"),160,300);}
  ctx.fillStyle="#666";ctx.fillText(t("navBack"),160,314);ctx.textAlign="left";
}
// ---- INTERNATIONAL CUP: tabellone ----
function drawCup(){
  ctx.fillStyle="#0a1024";ctx.fillRect(0,0,320,320);ctx.textAlign="center";
  ctx.fillStyle="#ffd84a";ctx.font="bold 14px monospace";ctx.fillText(t("intlCup"),160,20);
  const cup=career.cup;
  if(!cup){ctx.fillStyle="#aaa";ctx.font="bold 10px monospace";ctx.fillText("-",160,120);ctx.textAlign="left";return;}
  if(cup.done){ const iWon=cup.champion>=0&&cup.teams[cup.champion]&&cup.teams[cup.champion].me;
    ctx.fillStyle=iWon?"#00ff88":"#ff9a9a";ctx.font="bold 12px monospace";ctx.fillText(iWon?t("cupChampion"):cupTeamName(cup.teams[cup.champion]),160,38);
  } else if(!cup.alive){ ctx.fillStyle="#ff6060";ctx.font="bold 11px monospace";ctx.fillText(t("cupOut"),160,38); }
  else { ctx.fillStyle="#00e5ff";ctx.font="bold 11px monospace";ctx.fillText(cupRoundTitle(cup.round),160,38); }
  ctx.font="bold 9px monospace";const top=60,lh=22;
  for(let r=0;r<cup.rounds.length;r++){
    const rd=cup.rounds[r];let myM=null;
    for(const m of rd){ if(cup.teams[m.a].me||cup.teams[m.b].me){myM=m;break;} }
    const y=top+r*lh;
    ctx.textAlign="left";ctx.fillStyle="#8ecdff";ctx.fillText(cupRoundTitle(r),12,y);
    if(myM){ const meA=cup.teams[myM.a].me;const opp=cup.teams[meA?myM.b:myM.a];
      let res="";if(myM.winner>=0){res=(cup.teams[myM.winner].me)?" [V]":" [X]";}
      ctx.textAlign="right";ctx.fillStyle=(myM.winner>=0)?((cup.teams[myM.winner].me)?"#00ff88":"#ff6060"):"#ffffff";
      ctx.fillText(cupTeamName(opp)+res,308,y);
    }
  }
  ctx.textAlign="center";
  if(cupMyMatch()&&cup.alive&&!cup.done){ const opp=cupMyOpponent();
    ctx.fillStyle="#00e5ff";ctx.font="bold 10px monospace";ctx.fillText(t("cupNextMatch"),160,244);
    ctx.fillStyle="#ffffff";ctx.font="bold 12px monospace";ctx.fillText(t("cupVs")+" "+cupTeamName(opp),160,262);
    ctx.fillStyle="#8effc0";ctx.font="bold 12px monospace";ctx.fillText(lang==="it"?"A = GIOCA":"A = PLAY",160,284);
  }
  ctx.fillStyle="#666";ctx.font="bold 9px monospace";ctx.fillText(t("navBack"),160,314);ctx.textAlign="left";
}
// schermata promosse/retrocesse (fine o inizio campionato)
function drawSeasonMovements(titleKey){
  const mv=(state==="ENDSEASON")?career.endMovements:career.startMovements;
  ctx.fillStyle="#0c1730";ctx.fillRect(0,0,320,320);ctx.textAlign="center";
  ctx.fillStyle="#f8d820";ctx.font="bold 15px monospace";ctx.fillText(t(titleKey),160,26);
  if(mv){ctx.fillStyle="#00e5ff";ctx.font="bold 9px monospace";ctx.fillText(t(LEAGUE_DEFS[mv.lvl].key),160,42);}
  if(!mv){ctx.fillStyle="#aaa";ctx.font="bold 10px monospace";ctx.fillText("-",160,140);ctx.textAlign="left";return;}
  function nameOf(o){return (lang==="it"?o.it:o.en)||o.en;}
  let y=70;
  // campione (solo fine National)
  if(mv.champion){ctx.fillStyle="#ffd84a";ctx.font="bold 11px monospace";ctx.fillText(t("champion")+":",160,y);y+=16;ctx.fillStyle="#ffffff";ctx.font="bold 12px monospace";ctx.fillText(nameOf(mv.champion),160,y);y+=22;}
  // promosse
  if(mv.promoted&&mv.promoted.length){ctx.fillStyle="#00ff88";ctx.font="bold 11px monospace";ctx.fillText(t("promotedList"),160,y);y+=15;ctx.font="bold 10px monospace";ctx.fillStyle="#c8ffd8";mv.promoted.forEach(function(o){ctx.fillText(nameOf(o),160,y);y+=13;});y+=8;}
  // retrocesse
  if(mv.relegated&&mv.relegated.length){ctx.fillStyle="#ff6060";ctx.font="bold 11px monospace";ctx.fillText(t("relegatedList"),160,y);y+=15;ctx.font="bold 10px monospace";ctx.fillStyle="#ffc8c8";mv.relegated.forEach(function(o){ctx.fillText(nameOf(o),160,y);y+=13;});}
  ctx.fillStyle="#00e5ff";ctx.font="bold 11px monospace";ctx.fillText(t("continueA"),160,306);ctx.textAlign="left";
}
function drawPromo(){
  ctx.fillStyle="#0c1730";ctx.fillRect(0,0,320,320);ctx.textAlign="center";
  ctx.fillStyle="#f8d820";ctx.font="bold 16px monospace";ctx.fillText(t("seasonEnd"),160,40);
  let msg,col;if(promoOutcome==="promoted"){msg=t("promoted");col="#00ff88";}else if(promoOutcome==="relegated"){msg=t("relegated");col="#ff6060";}else if(promoOutcome==="won"){msg=t("careerWin");col="#ffd84a";}else{msg=t("stayed");col="#e8e860";}
  ctx.fillStyle=col;ctx.font="bold 20px monospace";ctx.fillText(msg,160,140);
  // esito obiettivo stagionale + bonus/malus
  if(objectiveActive){
    ctx.font="bold 12px monospace";ctx.fillStyle=objectiveMet?"#00ff88":"#ff6060";
    ctx.fillText(objectiveMet?t("objMet"):t("objFail"),160,172);
    ctx.font="bold 9px monospace";ctx.fillStyle=objectiveMet?"#8effc0":"#ffb0b0";
    ctx.fillText(objectiveMet?t("bonusNext"):t("malusNext"),160,188);
  }
  drawBigFootballer(160,258,1.4,(career?careerKit():AZZURRO_KIT),(promoOutcome==="relegated")?"idle":"celebrate");
  ctx.fillStyle="#00e5ff";ctx.font="bold 11px monospace";ctx.fillText(t("continueA"),160,304);ctx.textAlign="left";
}
function drawCareerWin(){const t2=splashTime;ctx.fillStyle="#1a2a5a";ctx.fillRect(0,0,320,320);for(let i=0;i<40;i++){const cx=(i*97+Math.floor(t2/30)*(i%3+1))%320,cy=(i*53+Math.floor(t2/20)*(i%2+1))%280+10;const colors=["#ffd84a","#ff5555","#44ddaa","#8844ff","#ffffff"];px(cx,cy,3,3,colors[i%colors.length]);}ctx.textAlign="center";ctx.fillStyle="#ffd84a";ctx.font="bold 18px monospace";ctx.fillText(t("careerWinTitle"),160,44);drawBigFootballer(160,150,1.3,(career?careerKit():AZZURRO_KIT),"celebrate");ctx.fillStyle="#ffffff";ctx.font="bold 9px monospace";wrapText(t("careerWinMsg"),160,188,300,12);const items=careerWinItems();const sel=((menuIndex%items.length)+items.length)%items.length;ctx.font="bold 13px monospace";items.forEach(function(key,i){const y=240+i*30;if(i===sel){ctx.fillStyle="#00e5ff";ctx.fillText("> "+t(key)+" <",160,y);}else{ctx.fillStyle="#aaa";ctx.fillText(t(key),160,y);}});ctx.fillStyle="#666";ctx.font="bold 8px monospace";ctx.fillText(t("navChoose"),160,312);ctx.textAlign="left";}
let lastTime=performance.now();
function gameLoop(now){let dt=now-lastTime;lastTime=now;if(dt>100)dt=100;try{update(dt);draw();}catch(err){console.error(err);}requestAnimationFrame(gameLoop);}
requestAnimationFrame(gameLoop);
</script>
