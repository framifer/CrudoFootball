<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crudo Football</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --gb-body: #c4cfa1;
    }

    body {
      background-color: #111;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }

    #phone-screen {
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 900px;
      background-color: var(--gb-body);
      display: flex;
      flex-direction: column;
      border: 2px solid #2a2a2a;
      border-radius: 26px 26px 44px 44px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9),
                  inset 0 0 8px rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    #screen-container {
      flex: 0 0 46%;
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    #game-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border: 4px solid #111;
      border-radius: 8px;
      background-color: #000;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.7);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      border-radius: 4px;
    }

    #controller {
      flex: 1;
      background-color: var(--gb-body);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 18px 40px;
      border-top: 4px solid #555;
    }

    .controls-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      padding: 0 4px;
    }

    .dpad {
      position: relative;
      width: 190px;
      height: 190px;
      flex-shrink: 0;
      filter: drop-shadow(3px 6px 5px rgba(0, 0, 0, 0.4));
    }

    .dpad-btn {
      position: absolute;
      background: linear-gradient(145deg, #3a3a3a, #111);
      border: none;
      cursor: pointer;
      box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.2),
                  inset -1px -1px 3px rgba(0, 0, 0, 0.8);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
      touch-action: none;
    }

    .dpad-up { top: 0; left: 67px; width: 56px; height: 67px; border-radius: 12px 12px 0 0; }
    .dpad-down { bottom: 0; left: 67px; width: 56px; height: 67px; border-radius: 0 0 12px 12px; }
    .dpad-left { top: 67px; left: 0; width: 67px; height: 56px; border-radius: 12px 0 0 12px; }
    .dpad-right { top: 67px; right: 0; width: 67px; height: 56px; border-radius: 0 12px 12px 0; }

    .dpad-btn:active,
    .dpad-btn.active {
      background: #111;
      transform: translate(1px, 2px);
      box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.9);
    }

    .action-buttons {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      transform: rotate(-15deg);
      filter: drop-shadow(3px 6px 5px rgba(0, 0, 0, 0.3));
    }

    .btn-round-container { text-align: center; }
    .btn-b-container { margin-top: 80px; }

    .btn-round {
      width: 66px;
      height: 66px;
      background: linear-gradient(145deg, #a72352, #6e1333);
      border-radius: 50%;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 22px;
      cursor: pointer;
      box-shadow: inset 1px 2px 3px rgba(255, 255, 255, 0.3),
                  inset -2px -2px 5px rgba(0, 0, 0, 0.6);
      transition: transform 0.05s ease;
      touch-action: none;
    }

    .btn-round:active,
    .btn-round.active {
      transform: translate(2px, 3px);
      box-shadow: inset 2px 2px 7px rgba(0, 0, 0, 0.8);
      background: #5b0f2a;
    }

    .controls-bottom {
      display: flex;
      justify-content: center;
      gap: 45px;
      margin-top: 0;
      margin-bottom: 40px;
    }

    .btn-pill-container {
      text-align: center;
      transform: rotate(-25deg);
      filter: drop-shadow(2px 4px 3px rgba(0, 0, 0, 0.3));
    }

    .btn-pill {
      width: 80px;
      height: 20px;
      background: linear-gradient(145deg, #6e6e6e, #333);
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.2),
                  inset -1px -1px 3px rgba(0, 0, 0, 0.7);
      touch-action: none;
    }

    .btn-pill:active,
    .btn-pill.active {
      transform: translate(1px, 2px);
      background: #222;
      box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.9);
    }

    .btn-pill-label {
      font-size: 12px;
      color: #306230;
      text-align: center;
      margin-top: 6px;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div id="phone-screen">
    <div id="screen-container">
      <div id="game-wrapper">
        <canvas id="gameCanvas" width="320" height="320"></canvas>
      </div>
    </div>
    <div id="controller">
      <div class="controls-top">
        <div class="dpad">
          <button class="dpad-btn dpad-up" id="btn-up"></button>
          <button class="dpad-btn dpad-down" id="btn-down"></button>
          <button class="dpad-btn dpad-left" id="btn-left"></button>
          <button class="dpad-btn dpad-right" id="btn-right"></button>
        </div>
        <div class="action-buttons">
          <div class="btn-round-container btn-b-container">
            <button class="btn-round" id="btn-b">B</button>
          </div>
          <div class="btn-round-container">
            <button class="btn-round" id="btn-a">A</button>
          </div>
        </div>
      </div>
      <div class="controls-bottom">
        <div class="btn-pill-container">
          <button class="btn-pill" id="btn-select"></button>
          <div class="btn-pill-label">SELECT</div>
        </div>
        <div class="btn-pill-container">
          <button class="btn-pill" id="btn-start"></button>
          <div class="btn-pill-label">START</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const SAVE_KEY = "crudoFootballChampionship_v1";
    const LANG_KEY = "crudoFootballLang";
    const TEAM_SIZE = 11;
    const HALF_MS = 60 * 1000;

    const FIELD_W = 720;
    const FIELD_H = 1560;
    const GOAL_W = 180;

    let lang = "en";
    try { lang = localStorage.getItem(LANG_KEY) || "en"; } catch (e) { }

    const I18N = {
      it: {
        title: "CRUDO FOOTBALL", pressStart: "Premi START", chooseTeamType: "SCEGLI CATEGORIA",
        nationals: "NAZIONALI", clubs: "CLUB", chooseTeam: "SCEGLI LA SQUADRA",
        championship: "CAMPIONATO", singleMatch: "PARTITA SINGOLA", loadChampionship: "CARICA SALVATAGGIO",
        chooseOpponent: "SCEGLI AVVERSARIO", chooseFormation: "SCEGLI IL MODULO", startMatch: "INIZIA PARTITA",
        viewStandings: "VEDI CLASSIFICA", saveChampionship: "SALVA PROGRESSI", exitToMenu: "ESCI AL MENU",
        saveAndExit: "SALVA ED ESCI", pause: "PAUSA", resume: "RIPRENDI", standings: "CLASSIFICA",
        finalStandings: "CLASSIFICA FINALE", fullTime: "FINE PARTITA!", halfTime: "INTERVALLO",
        firstHalf: "1\u00B0 TEMPO", secondHalf: "2\u00B0 TEMPO", result: "Risultato", matchInfo: "INFO PARTITA",
        matchDay: "Giornata", timeLeft: "Tempo restante", of: "di", matchStarting: "La partita sta per iniziare!",
        savedOk: "Salvataggio effettuato!", navChoose: "Frecce = scegli   A = conferma",
        navChooseConfirm: "Frecce = scegli   A/START = conferma", navTeamHint: "Frecce = scegli  A = ok  B = indietro",
        navBack: "B/SELECT = indietro", controlsHint: "Palla: A tiro/tiro forte  B passa/cross",
        controlsHint2: "No palla: A scivolata  B tackle", changeTeam: "B = cambia categoria/squadra",
        continueA: "A per continuare", aForStandings: "A per la classifica", aForMenu: "A per tornare al menu",
        langLabel: "LINGUA", toggleLangHint: "SELECT = English", go: "VIA", goal: "GOOOL!",
        win: "VITTORIA!", draw: "PAREGGIO", loss: "SCONFITTA", podiumWin: "CAMPIONE!",
        podiumWinMsg: "COMPLIMENTI, HAI VINTO IL CAMPIONATO!", podiumSecond: "SECONDO POSTO",
        podiumSecondMsg: "SEI ARRIVATO SECONDO", podiumThird: "TERZO POSTO", podiumThirdMsg: "SEI ARRIVATO TERZO",
        pts: "pt", played: "G", colHome: "vs"
      },
      en: {
        title: "CRUDO FOOTBALL", pressStart: "Press START", chooseTeamType: "CHOOSE CATEGORY",
        nationals: "NATIONALS", clubs: "CLUBS", chooseTeam: "CHOOSE TEAM",
        championship: "CHAMPIONSHIP", singleMatch: "SINGLE MATCH", loadChampionship: "LOAD SAVE",
        chooseOpponent: "CHOOSE OPPONENT", chooseFormation: "CHOOSE FORMATION", startMatch: "START MATCH",
        viewStandings: "VIEW STANDINGS", saveChampionship: "SAVE PROGRESS", exitToMenu: "EXIT TO MENU",
        saveAndExit: "SAVE & EXIT", pause: "PAUSE", resume: "RESUME", standings: "STANDINGS",
        finalStandings: "FINAL STANDINGS", fullTime: "FULL TIME!", halfTime: "HALF TIME",
        firstHalf: "1ST HALF", secondHalf: "2ND HALF", result: "Result", matchInfo: "MATCH INFO",
        matchDay: "Matchday", timeLeft: "Time left", of: "of", matchStarting: "The match is about to start!",
        savedOk: "Game saved!", navChoose: "Arrows = move   A = confirm",
        navChooseConfirm: "Arrows = move   A/START = confirm", navTeamHint: "Arrows = move  A = ok  B = back",
        navBack: "B/SELECT = back", controlsHint: "Ball: A shot/hard  B pass/cross",
        controlsHint2: "No ball: A slide  B tackle", changeTeam: "B = change category/team",
        continueA: "Press A to continue", aForStandings: "A for standings", aForMenu: "A to return to menu",
        langLabel: "LANGUAGE", toggleLangHint: "SELECT = Italiano", go: "GO", goal: "GOOOAL!",
        win: "WIN!", draw: "DRAW", loss: "DEFEAT", podiumWin: "CHAMPION!",
        podiumWinMsg: "CONGRATULATIONS, YOU WON THE CHAMPIONSHIP!", podiumSecond: "SECOND PLACE",
        podiumSecondMsg: "YOU FINISHED SECOND", podiumThird: "THIRD PLACE", podiumThirdMsg: "YOU FINISHED THIRD",
        pts: "pt", played: "P", colHome: "vs"
      }
    };

    function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key; }
    function toggleLang() { lang = (lang === "en") ? "it" : "en"; try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} }

    function kit(pattern, c1, c2, short, sock) {
      return { pattern: pattern, c1: c1, c2: c2 || c1, short: short || "#ffffff", sock: sock || c1 };
    }

    const NATIONAL_TEAMS = [
      { it: "ITALIA", en: "ITALY", kit: kit("solid", "#1b6ec2", "#1b6ec2", "#ffffff", "#1b6ec2") },
      { it: "SPAGNA", en: "SPAIN", kit: kit("solid", "#d81e2c", "#d81e2c", "#0b3d91", "#111111") },
      { it: "GERMANIA", en: "GERMANY", kit: kit("solid", "#f2f2f2", "#f2f2f2", "#111111", "#f2f2f2") },
      { it: "FRANCIA", en: "FRANCE", kit: kit("solid", "#141a4a", "#141a4a", "#ffffff", "#141a4a") },
      { it: "INGHILTERRA", en: "ENGLAND", kit: kit("vstripe", "#ffffff", "#d81e2c", "#111111", "#ffffff") },
      { it: "POLONIA", en: "POLAND", kit: kit("solid", "#efe6cf", "#efe6cf", "#c0142c", "#efe6cf") },
      { it: "BRASILE", en: "BRAZIL", kit: kit("solid", "#f7d117", "#f7d117", "#0b57a4", "#f7d117") },
      { it: "ARGENTINA", en: "ARGENTINA", kit: kit("vstripe", "#7ec6ea", "#ffffff", "#111111", "#7ec6ea") },
      { it: "USA", en: "USA", kit: kit("solid", "#ff6fae", "#ff6fae", "#1b2a6b", "#ff6fae") },
      { it: "GIAPPONE", en: "JAPAN", kit: kit("solid", "#6a30b0", "#6a30b0", "#ffffff", "#6a30b0") }
    ];

    const CLUB_TEAMS = [
      { it: "NAPOLI", en: "NAPOLI", kit: kit("solid", "#12a0e0", "#12a0e0", "#ffffff", "#12a0e0") },
      { it: "MILANO", en: "MILAN", kit: kit("vstripe", "#101014", "#1560dc", "#101014", "#101014") },
      { it: "LONDRA", en: "LONDON", kit: kit("solid", "#d81e2c", "#d81e2c", "#ffffff", "#d81e2c") },
      { it: "MANCHESTER C.", en: "MANCHESTER C.", kit: kit("solid", "#8ecdea", "#8ecdea", "#ffffff", "#8ecdea") },
      { it: "MONACO", en: "MUNICH", kit: kit("hstripe", "#111114", "#d81e2c", "#111114", "#111114") },
      { it: "MADRID", en: "MADRID", kit: kit("solid", "#f4f4f4", "#f4f4f4", "#f4f4f4", "#f4f4f4") },
      { it: "BARCELLONA", en: "BARCELONA", kit: kit("vstripe", "#1560dc", "#8a1030", "#0b3d70", "#1560dc") },
      { it: "PARIGI", en: "PARIS", kit: kit("solid", "#141a4a", "#141a4a", "#141a4a", "#141a4a") },
      { it: "LIVERPOOL C.", en: "LIVERPOOL C.", kit: kit("solid", "#7a4a24", "#7a4a24", "#5a3418", "#7a4a24") },
      { it: "TORINO", en: "TURIN", kit: kit("vstripe", "#f4f4f4", "#111114", "#111114", "#f4f4f4") }
    ];

    function teamName(team) { return team[lang] || team.en; }
    const GK_KIT = kit("solid", "#1fbf5a", "#1fbf5a", "#111111", "#1fbf5a");

    const PTS_WIN = 3;
    const PTS_DRAW = 1;
    const PTS_LOSS = 0;

    const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let crowdGain = null;
    let crowdNoiseSrc = null;
    let crowdLP = null;
    let crowdRoarMs = 0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtxClass();
        const bufSize = 2 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        crowdNoiseSrc = audioCtx.createBufferSource();
        crowdNoiseSrc.buffer = buffer;
        crowdNoiseSrc.loop = true;
        crowdLP = audioCtx.createBiquadFilter();
        crowdLP.type = "lowpass";
        crowdLP.frequency.setValueAtTime(700, audioCtx.currentTime);
        crowdGain = audioCtx.createGain();
        crowdGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
        crowdNoiseSrc.connect(crowdLP);
        crowdLP.connect(crowdGain);
        crowdGain.connect(audioCtx.destination);
        crowdNoiseSrc.start();
      }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
    }

    function updateCrowdSound(intensity) {
      if (!crowdGain || !crowdLP) return;
      const active = (state === "PLAYING" || state === "COUNTDOWN" || state === "HALFTIME");
      let vol = active ? (0.02 + intensity * 0.05) : 0.004;
      let cutoff = 700;
      if (crowdRoarMs > 0) { vol = 0.16; cutoff = 2600; }
      crowdGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.25);
      crowdLP.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.2);
    }

    function crowdRoar() { initAudio(); crowdRoarMs = 2200; updateCrowdSound(1); }

    function playSound(freq = 440, type = "square", duration = 0.08) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playWhistle() {
      playSound(2100, "square", 0.12);
      setTimeout(function () { playSound(1800, "square", 0.1); }, 120);
    }

    function playGoalJingle() {
      playSound(660, "triangle", 0.12);
      setTimeout(function () { playSound(880, "triangle", 0.12); }, 120);
      setTimeout(function () { playSound(1100, "triangle", 0.2); }, 240);
    }

    function playKick() { playSound(180, "square", 0.05); }

    let state = "SPLASH";
    let menuIndex = 0;
    let teamType = "national";
    let teamPool = NATIONAL_TEAMS;
    let playerTeamIndex = 0;
    let playerTeam = NATIONAL_TEAMS[0];
    let matchMode = "single";
    let championshipRound = 0;
    let championshipSchedule = [];
    let championshipStandings = [];
    let matchOpponentIndex = 1;
    let pendingOpp = 1;
    let pendingHome = true;
    let formationIndex = 0;
    let matchElapsedMs = 0;
    let matchHalf = 1;
    let scoreHome = 0;
    let scoreAway = 0;
    let playerSide = 0;
    let kickoffTeam = 0;
    let firstHalfKickoff = 0;
    let countdownMs = 0;
    let showInfoOverlay = false;
    let goalFlashMs = 0;
    let goalScorerTeam = 0;
    let goalFlashStart = 0;
    let halfBreakMs = 0;
    let pauseIndex = 0;
    let preraceIndex = 0;
    let hasSavedGame = false;
    let standingsReturn = "PRERACE";
    let saveFlashMs = 0;
    let splashTime = 0;
    let finalRank = 1;

    const move = { up: false, down: false, left: false, right: false };
    const keyHeld = { a: false, b: false };
    let aPressedFrame = false;
    let bPressedFrame = false;
    let aHoldMs = 0;
    let bHoldMs = 0;
    let lastDir = { x: 1, y: 0 };
    let slide = { active: false, ms: 0, vx: 0, vy: 0 };

    let rngState = 123456789;
    function seedRng(seed) { rngState = (seed >>> 0) || 1; }
    function rng() {
      rngState ^= rngState << 13; rngState >>>= 0;
      rngState ^= rngState >> 17;
      rngState ^= rngState << 5; rngState >>>= 0;
      return rngState / 4294967296;
    }
    function rngRange(min, max) { return min + rng() * (max - min); }
    function rngInt(min, max) { return Math.floor(rngRange(min, max + 1)); }

    let players = [];
    let ball = null;
    let controlledIdx = 0;

    const FORMATIONS = {
      "4-4-2": [4, 4, 2], "4-3-3": [4, 3, 3], "4-5-1": [4, 5, 1],
      "5-3-2": [5, 3, 2], "5-4-1": [5, 4, 1], "3-4-3": [3, 4, 3], "3-5-2": [3, 5, 2]
    };
    const FORMATION_NAMES = Object.keys(FORMATIONS);
    const LINE_DEPTH = { def: 0.16, mid: 0.31, att: 0.45 };

    function buildFormation(name) {
      const counts = FORMATIONS[name] || FORMATIONS["4-4-2"];
      const players = [{ role: "gk", fx: 0.04, fy: 0.50 }];
      const lines = [
        { role: "def", n: counts[0] },
        { role: "mid", n: counts[1] },
        { role: "att", n: counts[2] }
      ];
      lines.forEach(function (line) {
        const n = line.n;
        for (let i = 0; i < n; i++) {
          const fy = (n === 1) ? 0.5 : 0.14 + (0.72) * (i / (n - 1));
          players.push({ role: line.role, fx: LINE_DEPTH[line.role], fy: fy });
        }
      });
      return players;
    }

    let playerFormation = "4-4-2";
    let opponentFormation = "4-4-2";
    function randomFormation() { return FORMATION_NAMES[rngInt(0, FORMATION_NAMES.length - 1)] || "4-4-2"; }
    function formationName(name) { return name; }

    function defendsBottom(team) {
      if (team === 0) return (playerSide === 0);
      return (playerSide !== 0);
    }
    function attackDir(team) { return defendsBottom(team) ? -1 : 1; }
    function homeX(team, fy) { return fy * FIELD_W; }
    function homeY(team, fx) {
      if (defendsBottom(team)) { return FIELD_H - fx * FIELD_H; }
      else { return fx * FIELD_H; }
    }
    function ownGoalY(team) { return defendsBottom(team) ? FIELD_H : 0; }
    function targetGoalY(team) { return defendsBottom(team) ? 0 : FIELD_H; }

    function makePlayer(team, roleDef, num) {
      return {
        team: team, role: roleDef.role, num: num, fx: roleDef.fx, fy: roleDef.fy,
        x: 0, y: 0, vx: 0, vy: 0, kickCooldown: 0
      };
    }

    function resetFormation(kickTeam) {
      players.forEach(function (p) {
        p.x = homeX(p.team, p.fy);
        p.y = homeY(p.team, p.fx);
        p.vx = 0; p.vy = 0;
        p.kickCooldown = 0;
      });
      ball.x = FIELD_W / 2;
      ball.y = FIELD_H / 2;
      ball.vx = 0; ball.vy = 0;
      ball.z = 0; ball.vz = 0;
      ball.high = false;
      let kicker = -1, bestD = Infinity;
      for (let i = 0; i < players.length; i++) {
        if (players[i].team !== kickTeam || players[i].role === "gk") continue;
        const d = Math.hypot(players[i].x - FIELD_W / 2, players[i].y - FIELD_H / 2);
        if (d < bestD) { bestD = d; kicker = i; }
      }
      if (kicker >= 0) {
        players[kicker].x = FIELD_W / 2;
        players[kicker].y = FIELD_H / 2 + (defendsBottom(kickTeam) ? 6 : -6);
        ball.owner = kicker;
        ball.lastTouch = kickTeam;
      } else {
        ball.owner = -1;
      }
      slide.active = false; slide.ms = 0;
      aHoldMs = 0; bHoldMs = 0;
      aPressedFrame = false; bPressedFrame = false;
    }

    function setupMatch(oppIndex, isHome) {
      matchOpponentIndex = oppIndex;
      scoreHome = 0;
      scoreAway = 0;
      matchHalf = 1;
      matchElapsedMs = 0;
      goalFlashMs = 0;
      halfBreakMs = 0;
      showInfoOverlay = false;
      playerSide = 0;
      opponentFormation = randomFormation();
      const myForm = buildFormation(playerFormation);
      const oppForm = buildFormation(opponentFormation);
      players = [];
      for (let i = 0; i < TEAM_SIZE; i++) { players.push(makePlayer(0, myForm[i], i + 1)); }
      for (let i = 0; i < TEAM_SIZE; i++) { players.push(makePlayer(1, oppForm[i], i + 1)); }
      kickoffTeam = (rng() < 0.5) ? 0 : 1;
      firstHalfKickoff = kickoffTeam;
      ball = { x: FIELD_W / 2, y: FIELD_H / 2, z: 0, vx: 0, vy: 0, vz: 0, owner: -1, high: false };
      resetFormation(kickoffTeam);
      controlledIdx = TEAM_SIZE - 1;
      countdownMs = 3200;
      state = "COUNTDOWN";
    }

    function teamKit(team) {
      if (team === 0) return playerTeam.kit;
      return teamPool[matchOpponentIndex].kit;
    }

    function teamPlayers(team) {
      const out = [];
      for (let i = 0; i < players.length; i++) { if (players[i].team === team) out.push(i); }
      return out;
    }

    function nearestToBall(team) {
      let best = -1, bestD = Infinity;
      for (let i = 0; i < players.length; i++) {
        if (players[i].team !== team) continue;
        if (players[i].role === "gk") continue;
        const d = dist2(players[i], ball);
        if (d < bestD) { bestD = d; best = i; }
      }
      return best;
    }

    function dist2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }
    function ballOwner() { return (ball.owner >= 0) ? players[ball.owner] : null; }

    const PLAYER_SPEED = 3.7;
    const AI_SPEED = 3.0;
    const MY_AI_MULT = 1.18;
    const OPP_AI_MULT = 0.82;
    const BALL_FRICTION = 0.972;
    const CATCH_RADIUS = 12;
    const PASS_POWER = 10.5;
    const CROSS_POWER = 18;
    const SHOOT_POWER = 17;
    const SHOOT_POWER_HARD = 26;
    const GK_SPEED = 2.7;
    const SLIDE_STEAL_RADIUS = CATCH_RADIUS + 6;

    function updateMatch(dt) {
      matchElapsedMs += dt;
      const nearGoal = Math.min(ball.x, FIELD_W - ball.x) / (FIELD_W / 2);
      updateCrowdSound(1 - nearGoal);
      if (matchElapsedMs >= HALF_MS) {
        if (matchHalf === 1) { startHalfTime(); return; }
        else { finishMatch(); return; }
      }
      updateControlledPlayer();
      updateAI();
      updateBall();
      handleBallPossession();
      checkGoal();
    }

    function updateControlledPlayer() {
      if (!slide.active) {
        if (ball.owner < 0 || players[ball.owner].team !== 0) {
          const n = nearestToBall(0);
          if (n >= 0) controlledIdx = n;
        } else if (players[ball.owner].team === 0) {
          controlledIdx = ball.owner;
        }
      }
      const p = players[controlledIdx];
      let dx = 0, dy = 0;
      if (move.left) dx -= 1;
      if (move.right) dx += 1;
      if (move.up) dy -= 1;
      if (move.down) dy += 1;
      if (dx !== 0 || dy !== 0) {
        const l = Math.hypot(dx, dy);
        lastDir.x = dx / l; lastDir.y = dy / l;
      }
      if (slide.active) {
        slide.ms -= 16;
        p.x += slide.vx;
        p.y += slide.vy;
        slide.vx *= 0.9;
        slide.vy *= 0.9;
        clampToField(p);
        if (ball.owner < 0 || players[ball.owner].team !== 0) {
          if (Math.hypot(ball.x - p.x, ball.y - p.y) < CATCH_RADIUS + 6) {
            const prevOwner = ball.owner;
            ball.owner = -1;
            if (prevOwner >= 0) { ball.vx = lastDir.x * 4; ball.vy = lastDir.y * 4; }
          }
        }
        if (slide.ms <= 0) { slide.active = false; p.kickCooldown = 10; }
        return;
      }
      const spd = PLAYER_SPEED;
      const len = Math.hypot(dx, dy) || 1;
      p.x += (dx / len) * spd;
      p.y += (dy / len) * spd;
      clampToField(p);
      if (keyHeld.a) aHoldMs += 16;
      if (keyHeld.b) bHoldMs += 16;
      if (ball.owner === controlledIdx) {
        const dir = attackDir(0);
        ball.x = p.x;
        ball.y = p.y + dir * 7;
        ball.vx = 0; ball.vy = 0;
        if (!keyHeld.a && aHoldMs > 0) {
          const charge = Math.min(1, aHoldMs / 450);
          shootBall(0, charge);
          aHoldMs = 0;
        }
        if (!keyHeld.b && bHoldMs > 0) {
          if (bHoldMs >= 260) { crossBall(0, Math.min(1, bHoldMs / 700)); }
          else { passBall(0); }
          bHoldMs = 0;
        }
      } else {
        if (aPressedFrame && p.kickCooldown === 0) { startSlide(p); }
        if (bPressedFrame && ball.owner !== controlledIdx) {
          const carrier = opponentBallCarrier(0);
          const targetX = carrier ? carrier.x : ball.x;
          const targetY = carrier ? carrier.y : ball.y;
          const ddx = targetX - p.x, ddy = targetY - p.y;
          const dd = Math.hypot(ddx, ddy) || 1;
          const lunge = 10;
          p.x += (ddx / dd) * lunge;
          p.y += (ddy / dd) * lunge;
          clampToField(p);
          if (Math.hypot(ball.x - p.x, ball.y - p.y) < CATCH_RADIUS + 5) {
            const prevOwner = ball.owner;
            ball.owner = controlledIdx;
            ball.high = false;
            if (prevOwner >= 0) playSound(120, "square", 0.06);
          }
        }
        aHoldMs = 0;
        bHoldMs = 0;
      }
    }

    function opponentBallCarrier(myTeam) {
      if (ball.owner >= 0 && players[ball.owner].team !== myTeam) { return players[ball.owner]; }
      return null;
    }

    function startSlide(p) {
      slide.active = true;
      slide.ms = 300;
      const power = 5.2;
      const carrier = opponentBallCarrier(0);
      let tx, ty;
      if (carrier) { tx = carrier.x; ty = carrier.y; }
      else if (ball.owner < 0) { tx = ball.x; ty = ball.y; }
      else { tx = p.x + lastDir.x * 50; ty = p.y + lastDir.y * 50; }
      const ddx = tx - p.x, ddy = ty - p.y;
      const dd = Math.hypot(ddx, ddy) || 1;
      slide.vx = (ddx / dd) * power;
      slide.vy = (ddy / dd) * power;
      lastDir.x = ddx / dd; lastDir.y = ddy / dd;
      playSound(200, "sawtooth", 0.12);
    }

    function clampToField(p) {
      if (p.x < 2) p.x = 2;
      if (p.x > FIELD_W - 2) p.x = FIELD_W - 2;
      if (p.y < 4) p.y = 4;
      if (p.y > FIELD_H - 4) p.y = FIELD_H - 4;
    }

    function passBall(team) {
      const from = ballOwner();
      if (!from) return;
      let best = -1, bestD = Infinity;
      for (let i = 0; i < players.length; i++) {
        const p = players[i];
        if (p.team !== team || i === ball.owner || p.role === "gk") continue;
        const d = Math.hypot(p.x - from.x, p.y - from.y);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0) return;
      const target = players[best];
      const tx = target.x, ty = target.y;
      const ang = Math.atan2(ty - from.y, tx - from.x);
      const targetDist = Math.hypot(tx - from.x, ty - from.y);
      const power = Math.max(PASS_POWER * 0.8, Math.min(PASS_POWER * 1.4, targetDist * 0.06));
      ball.owner = -1;
      ball.lastTouch = team;
      ball.high = false;
      ball.vx = Math.cos(ang) * power;
      ball.vy = Math.sin(ang) * power;
      from.kickCooldown = 15;
      playKick();
    }

    function crossBall(team, charge) {
      const from = ballOwner();
      if (!from) return;
      const dir = attackDir(team);
      let best = -1, bestFwd = -Infinity;
      for (let i = 0; i < players.length; i++) {
        const p = players[i];
        if (p.team !== team || i === ball.owner || p.role === "gk") continue;
        const fwd = (p.y - from.y) * dir;
        if (fwd > bestFwd) { bestFwd = fwd; best = i; }
      }
      let tx, ty;
      if (best >= 0) { tx = players[best].x; ty = players[best].y; }
      else { tx = FIELD_W / 2; ty = targetGoalY(team) - dir * (FIELD_H * 0.12); }
      const ang = Math.atan2(ty - from.y, tx - from.x);
      const power = CROSS_POWER * (0.8 + 0.4 * charge);
      ball.owner = -1;
      ball.lastTouch = team;
      ball.high = true;
      ball.vx = Math.cos(ang) * power;
      ball.vy = Math.sin(ang) * power;
      from.kickCooldown = 18;
      playKick();
      setTimeout(function () { playSound(520, "triangle", 0.08); }, 20);
    }

    function shootBall(team, charge) {
      const from = ballOwner();
      if (!from) return;
      if (charge === undefined) charge = 0.7;
      const goalY = targetGoalY(team);
      const goalX = FIELD_W / 2 + rngRange(-GOAL_W / 2, GOAL_W / 2);
      const ang = Math.atan2(goalY - from.y, goalX - from.x);
      const power = SHOOT_POWER + (SHOOT_POWER_HARD - SHOOT_POWER) * charge;
      ball.owner = -1;
      ball.lastTouch = team;
      ball.vx = Math.cos(ang) * power;
      ball.vy = Math.sin(ang) * power;
      ball.high = charge > 0.5;
      from.kickCooldown = 20;
      playKick();
      setTimeout(function () { playSound(charge > 0.5 ? 70 : 90, "sawtooth", 0.06); }, 30);
    }

    function updateAI() {
      const owner = ballOwner();
      for (let i = 0; i < players.length; i++) {
        const p = players[i];
        if (p.kickCooldown > 0) p.kickCooldown--;
        if (i === controlledIdx && p.team === 0) continue;
        if (p.role === "gk") { updateGoalkeeper(p); continue; }
        const aggressive = (p.team === 1);
        const spd = AI_SPEED * (p.team === 0 ? MY_AI_MULT : OPP_AI_MULT);
        const myTeamHasBall = owner && owner.team === p.team;
        const iAmNearest = (nearestToBall(p.team) === i);
        let tx, ty;
        if (owner && i === ball.owner) {
          const dir = attackDir(p.team);
          const goalY = targetGoalY(p.team);
          tx = p.x + (FIELD_W / 2 - p.x) * 0.04;
          ty = p.y + dir * 45;
          moveToward(p, tx, ty, spd);
          ball.x = p.x; ball.y = p.y + dir * 7;
          const distGoal = Math.abs(goalY - p.y);
          const shootRange = aggressive ? FIELD_H * 0.20 : FIELD_H * 0.34;
          const shootChance = aggressive ? 0.05 : 0.05;
          const passChance = aggressive ? 0.02 : 0.02;
          if (distGoal < shootRange && rng() < shootChance) { shootBall(p.team, aggressive ? 0.8 : 0.8); }
          else if (rng() < passChance) { passBall(p.team); }
          continue;
        }
        if (!myTeamHasBall && owner && owner.team !== p.team) {
          const carrier = owner;
          const distCarrier = Math.hypot(carrier.x - p.x, carrier.y - p.y);
          const rank = closenessRank(p.team, i, carrier);
          const isChaser = (p.team === 0) ? (rank <= 2) : (rank <= 1);
          const tackleRange = aggressive ? CATCH_RADIUS + 2 : CATCH_RADIUS + 4;
          const tackleChance = aggressive ? 0.09 : 0.24;
          const chaserSpeed = spd;
          if (isChaser && distCarrier < tackleRange && p.kickCooldown === 0 && rng() < tackleChance) {
            ball.owner = i;
            ball.vx = 0; ball.vy = 0;
            ball.high = false;
            carrier.kickCooldown = 18;
            playSound(140, "square", 0.06);
            continue;
          }
          if (isChaser) {
            const dir = attackDir(carrier.team);
            tx = carrier.x;
            ty = carrier.y + dir * 6;
            moveToward(p, tx, ty, chaserSpeed);
            clampToField(p);
            continue;
          } else {
            tx = homeX(p.team, p.fy) + (ball.x - FIELD_W / 2) * 0.18;
            ty = homeY(p.team, p.fx) + (ball.y - FIELD_H / 2) * 0.12;
          }
          moveToward(p, tx, ty, spd);
          clampToField(p);
          continue;
        }
        if (myTeamHasBall) {
          const dir = attackDir(p.team);
          const carrier = owner;
          const rankToCarrier = closenessRankExcluding(p.team, i, carrier, ball.owner);
          const runner = mostAdvanced(p.team, ball.owner);
          if (rankToCarrier === 1) {
            tx = carrier.x + (p.x < carrier.x ? -24 : 24);
            ty = carrier.y + dir * 26;
          } else if (i === runner) {
            tx = FIELD_W / 2 + (p.x - FIELD_W / 2) * 0.5;
            ty = targetGoalY(p.team) + dir * (-FIELD_H * 0.10);
          } else {
            const goalY = targetGoalY(p.team);
            const advance = 1 - Math.abs(ball.y - goalY) / FIELD_H;
            tx = homeX(p.team, p.fy);
            let baseY = homeY(p.team, p.fx) + dir * 60;
            if (p.role === "att" || p.role === "mid") {
              if (p.team === 0) {
                const attackPush = (p.role === "att") ? 0.34 : 0.22;
                const targetLine = targetGoalY(p.team) + dir * (FIELD_H * attackPush);
                tx = homeX(p.team, p.fy) + (ball.x - homeX(p.team, p.fy)) * 0.35;
                ty = targetLine;
              } else {
                const pushFactor = (p.role === "att") ? 0.85 : 0.55;
                const supportY = ball.y + dir * (p.role === "att" ? 40 : 90);
                baseY = baseY * (1 - pushFactor * advance) + supportY * (pushFactor * advance);
                ty = baseY;
              }
            } else {
              ty = baseY;
            }
          }
        } else {
          const rankToBall = closenessRank(p.team, i, ball);
          const chasersWanted = (p.team === 0) ? 2 : 1;
          if (rankToBall <= chasersWanted) {
            tx = ball.x; ty = ball.y;
          } else {
            tx = homeX(p.team, p.fy) + (ball.x - FIELD_W / 2) * 0.15;
            ty = homeY(p.team, p.fx) + (ball.y - FIELD_H / 2) * 0.15;
          }
        }
        moveToward(p, tx, ty, spd);
        clampToField(p);
      }
    }

    function closenessRank(team, idx, target) {
      const myD = Math.hypot(players[idx].x - target.x, players[idx].y - target.y);
      let rank = 1;
      for (let j = 0; j < players.length; j++) {
        if (j === idx) continue;
        const q = players[j];
        if (q.team !== team || q.role === "gk") continue;
        const d = Math.hypot(q.x - target.x, q.y - target.y);
        if (d < myD) rank++;
      }
      return rank;
    }

    function closenessRankExcluding(team, idx, target, excludeIdx) {
      const myD = Math.hypot(players[idx].x - target.x, players[idx].y - target.y);
      let rank = 1;
      for (let j = 0; j < players.length; j++) {
        if (j === idx || j === excludeIdx) continue;
        const q = players[j];
        if (q.team !== team || q.role === "gk") continue;
        const d = Math.hypot(q.x - target.x, q.y - target.y);
        if (d < myD) rank++;
      }
      return rank;
    }

    function mostAdvanced(team, excludeIdx) {
      const goalY = targetGoalY(team);
      let best = -1, bestD = Infinity;
      for (let i = 0; i < players.length; i++) {
        const q = players[i];
        if (q.team !== team || q.role === "gk" || i === excludeIdx) continue;
        if (i === controlledIdx && team === 0) continue;
        const d = Math.abs(q.y - goalY);
        if (d < bestD) { bestD = d; best = i; }
      }
      return best;
    }

    function updateGoalkeeper(p) {
      const goalY = ownGoalY(p.team);
      const targetY = goalY + (goalY === 0 ? 12 : -12);
      let targetX = FIELD_W / 2;
      const inOwnHalf = (goalY === 0) ? (ball.y < FIELD_H * 0.4) : (ball.y > FIELD_H * 0.6);
      if (inOwnHalf) {
        targetX = Math.max(FIELD_W / 2 - GOAL_W / 2, Math.min(FIELD_W / 2 + GOAL_W / 2, ball.x));
      }
      moveToward(p, targetX, targetY, GK_SPEED);
      if (Math.hypot(ball.x - p.x, ball.y - p.y) < CATCH_RADIUS + 3 && ball.owner < 0) {
        const dir = (goalY === 0) ? 1 : -1;
        ball.owner = -1;
        ball.lastTouch = p.team;
        ball.vy = dir * (PASS_POWER + rngRange(0, 3));
        ball.vx = rngRange(-3, 3);
        playSound(300, "square", 0.08);
      }
    }

    function moveToward(p, tx, ty, spd) {
      const dx = tx - p.x, dy = ty - p.y;
      const d = Math.hypot(dx, dy);
      if (d < 1) return;
      p.x += (dx / d) * spd;
      p.y += (dy / d) * spd;
    }

    function updateBall() {
      if (ball.owner >= 0) { ball.high = false; return; }
      ball.x += ball.vx;
      ball.y += ball.vy;
      const fric = ball.high ? 0.985 : BALL_FRICTION;
      ball.vx *= fric;
      ball.vy *= fric;
      if (Math.abs(ball.vx) < 0.05) ball.vx = 0;
      if (Math.abs(ball.vy) < 0.05) ball.vy = 0;
      if (goalFlashMs > 0) return;
      if (ball.x < 0 || ball.x > FIELD_W) {
        const throwInTeam = otherTeam(ball.lastTouch);
        const ex = (ball.x < 0) ? 2 : FIELD_W - 2;
        restartFromOut(throwInTeam, ex, clampY(ball.y), "throwin");
        return;
      }
      if (ball.y < 0 && !isInGoalMouth(ball.x)) { handleGoalLineOut(0); return; }
      if (ball.y > FIELD_H && !isInGoalMouth(ball.x)) { handleGoalLineOut(FIELD_H); return; }
    }

    function clampY(y) { return Math.max(6, Math.min(FIELD_H - 6, y)); }
    function clampX(x) { return Math.max(6, Math.min(FIELD_W - 6, x)); }
    function otherTeam(tm) { return (tm === 0) ? 1 : 0; }

    function handleGoalLineOut(goalY) {
      const last = ball.lastTouch;
      const defTeam = (ownGoalY(0) === goalY) ? 0 : 1;
      if (last === defTeam) {
        const cornerTeam = otherTeam(defTeam);
        const cx = (ball.x < FIELD_W / 2) ? 6 : FIELD_W - 6;
        const cy = (goalY === 0) ? 6 : FIELD_H - 6;
        restartFromOut(cornerTeam, cx, cy, "corner");
      } else {
        restartGoalKick(defTeam, goalY);
      }
    }

    function restartFromOut(team, x, y, kind) {
      ball.x = clampX(x); ball.y = clampY(y);
      ball.vx = 0; ball.vy = 0; ball.high = false;
      let best = -1, bestD = Infinity;
      for (let i = 0; i < players.length; i++) {
        const p = players[i];
        if (p.team !== team || p.role === "gk") continue;
        const d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) {
        players[best].x = ball.x;
        players[best].y = ball.y;
        players[best].kickCooldown = 0;
        ball.owner = best;
        ball.lastTouch = team;
        controlledIfMine(best, team);
      }
      playSound(500, "square", 0.05);
    }

    function restartGoalKick(defTeam, goalY) {
      let gkIdx = -1;
      for (let i = 0; i < players.length; i++) {
        if (players[i].team === defTeam && players[i].role === "gk") { gkIdx = i; break; }
      }
      const gy = (goalY === 0) ? 40 : FIELD_H - 40;
      ball.x = FIELD_W / 2; ball.y = gy;
      ball.vx = 0; ball.vy = 0; ball.high = false;
      if (gkIdx >= 0) {
        players[gkIdx].x = FIELD_W / 2;
        players[gkIdx].y = (goalY === 0) ? 20 : FIELD_H - 20;
        ball.owner = gkIdx;
        ball.lastTouch = defTeam;
        controlledIfMine(gkIdx, defTeam);
      }
      playSound(300, "square", 0.06);
    }

    function controlledIfMine(idx, team) { if (team === 0) controlledIdx = idx; }

    function handleBallPossession() {
      if (ball.owner >= 0) return;
      let best = -1, bestD = CATCH_RADIUS * CATCH_RADIUS;
      for (let i = 0; i < players.length; i++) {
        const p = players[i];
        if (p.kickCooldown > 0) continue;
        const d = dist2(p, ball);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) {
        ball.owner = best;
        ball.lastTouch = players[best].team;
        ball.vx = 0; ball.vy = 0;
      }
    }

    function isInGoalMouth(x) { return x > FIELD_W / 2 - GOAL_W / 2 && x < FIELD_W / 2 + GOAL_W / 2; }

    function checkGoal() {
      if (goalFlashMs > 0) return;
      if (ball.y <= 1 && isInGoalMouth(ball.x)) { scoreGoal(scoringTeamForGoalY(0)); }
      else if (ball.y >= FIELD_H - 1 && isInGoalMouth(ball.x)) { scoreGoal(scoringTeamForGoalY(FIELD_H)); }
    }

    function scoringTeamForGoalY(goalY) {
      const defTeam = (ownGoalY(0) === goalY) ? 0 : 1;
      return defTeam === 0 ? 1 : 0;
    }

    function scoreGoal(team) {
      if (team === 0) scoreHome++; else scoreAway++;
      goalFlashMs = 2600;
      goalScorerTeam = team;
      goalFlashStart = splashTime;
      playGoalJingle();
      crowdRoar();
      updateCrowdSound(1);
      kickoffTeam = (team === 0) ? 1 : 0;
    }

    function startHalfTime() {
      state = "HALFTIME";
      halfBreakMs = 3000;
      matchHalf = 2;
      matchElapsedMs = 0;
      playerSide = 1;
      kickoffTeam = (firstHalfKickoff === 0) ? 1 : 0;
      playWhistle();
      updateCrowdSound(0);
    }

    function resumeSecondHalf() {
      resetFormation(kickoffTeam);
      state = "COUNTDOWN";
      countdownMs = 2200;
      playSound(500, "square", 0.1);
    }

    function finishMatch() {
      state = "FULLTIME";
      updateCrowdSound(0);
      playWhistle();
      if (matchMode === "championship") {
        awardChampionshipResults(scoreHome, scoreAway, matchOpponentIndex);
      }
    }

    function afterMatch() {
      if (matchMode === "championship") { state = "STANDINGS"; standingsReturn = "ADVANCE"; }
      else { backToMenu(); }
    }

    function afterStandings() {
      if (standingsReturn === "PRERACE") { state = "PRERACE"; return; }
      if (standingsReturn === "MENU") { goToMainMenu(); return; }
      championshipRound++;
      if (championshipRound >= CHAMP_TOTAL) {
        finalRank = computeFinalRank();
        if (finalRank <= 3) {
          splashTime = 0;
          state = "PODIUM";
          playSound(880, "triangle", 0.2);
          setTimeout(function () { playSound(1100, "triangle", 0.2); }, 180);
          setTimeout(function () { playSound(1320, "triangle", 0.3); }, 360);
        } else { backToMenu(); }
        return;
      }
      state = "PRERACE";
      preraceIndex = 0;
    }

    function buildChampionshipSchedule() {
      championshipSchedule = [];
      for (let i = 0; i < teamPool.length; i++) {
        if (i === playerTeamIndex) continue;
        championshipSchedule.push({ opponent: i, home: true });
      }
      for (let i = 0; i < teamPool.length; i++) {
        if (i === playerTeamIndex) continue;
        championshipSchedule.push({ opponent: i, home: false });
      }
    }

    const CHAMP_TOTAL = 18;

    function initChampionshipStandings() {
      championshipStandings = [];
      for (let i = 0; i < teamPool.length; i++) {
        championshipStandings.push({
          teamIndex: i, name: teamName(teamPool[i]), kit: teamPool[i].kit,
          isPlayer: (i === playerTeamIndex), points: 0, played: 0, gf: 0, ga: 0
        });
      }
    }

    function getStanding(teamIndex) {
      return championshipStandings.find(function (s) { return s.teamIndex === teamIndex; });
    }

    function awardChampionshipResults(myGoals, oppGoals, oppIndex) {
      const me = getStanding(playerTeamIndex);
      const opp = getStanding(oppIndex);
      applyResult(me, opp, myGoals, oppGoals);
      const others = [];
      for (let i = 0; i < teamPool.length; i++) {
        if (i !== playerTeamIndex && i !== oppIndex) others.push(i);
      }
      for (let k = 0; k < others.length; k++) {
        const j = rngInt(k, others.length - 1);
        const tmp = others[k]; others[k] = others[j]; others[j] = tmp;
      }
      for (let k = 0; k + 1 < others.length; k += 2) {
        const a = getStanding(others[k]);
        const b = getStanding(others[k + 1]);
        const ga = rngInt(0, 4);
        const gb = rngInt(0, 4);
        applyResult(a, b, ga, gb);
      }
    }

    function applyResult(sA, sB, gA, gB) {
      sA.played++; sB.played++;
      sA.gf += gA; sA.ga += gB;
      sB.gf += gB; sB.ga += gA;
      if (gA > gB) { sA.points += PTS_WIN; sB.points += PTS_LOSS; }
      else if (gA < gB) { sB.points += PTS_WIN; sA.points += PTS_LOSS; }
      else { sA.points += PTS_DRAW; sB.points += PTS_DRAW; }
    }

    function sortedStandings() {
      return championshipStandings.slice().sort(function (a, b) {
        if (b.points !== a.points) return b.points - a.points;
        const dA = a.gf - a.ga, dB = b.gf - b.ga;
        if (dB !== dA) return dB - dA;
        return b.gf - a.gf;
      });
    }

    function computeFinalRank() {
      const sorted = sortedStandings();
      for (let i = 0; i < sorted.length; i++) { if (sorted[i].isPlayer) return i + 1; }
      return sorted.length;
    }

    function saveChampionship() {
      try {
        const data = {
          v: 1, teamType: teamType, playerTeamIndex: playerTeamIndex,
          championshipRound: championshipRound, schedule: championshipSchedule,
          standings: championshipStandings
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        hasSavedGame = true;
        return true;
      } catch (e) { return false; }
    }

    function loadChampionship() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;
        const d = JSON.parse(raw);
        teamType = d.teamType || "national";
        teamPool = (teamType === "club") ? CLUB_TEAMS : NATIONAL_TEAMS;
        playerTeamIndex = d.playerTeamIndex || 0;
        playerTeam = teamPool[playerTeamIndex];
        championshipRound = d.championshipRound || 0;
        championshipSchedule = d.schedule || [];
        championshipStandings = d.standings || [];
        if (championshipSchedule.length === 0) buildChampionshipSchedule();
        if (championshipStandings.length === 0) initChampionshipStandings();
        return true;
      } catch (e) { return false; }
    }

    function checkSavedGame() {
      try { hasSavedGame = !!localStorage.getItem(SAVE_KEY); } catch (e) { hasSavedGame = false; }
    }
    checkSavedGame();

    function pressAction(action) {
      switch (state) {
        case "SPLASH":
          if (action === "start" || action === "a") { playSound(660, "square", 0.1); state = "TEAMTYPE_SELECT"; menuIndex = 0; }
          break;
        case "TEAMTYPE_SELECT": navTeamType(action); break;
        case "TEAM_SELECT": navTeam(action); break;
        case "MENU": navMainMenu(action); break;
        case "OPPONENT_SELECT": navOpponent(action); break;
        case "FORMATION_SELECT": navFormation(action); break;
        case "PRERACE": navPrerace(action); break;
        case "PLAYING":
          if (action === "start") openPause();
          if (action === "select") { showInfoOverlay = true; playSound(500, "square", 0.05); openPause(); }
          break;
        case "PAUSE": navPause(action); break;
        case "HALFTIME": if (action === "a" || action === "start") resumeSecondHalf(); break;
        case "FULLTIME": if (action === "a" || action === "start") afterMatch(); break;
        case "STANDINGS": if (action === "a" || action === "start") afterStandings(); break;
        case "PODIUM": if (action === "a" || action === "start") { backToMenu(); } break;
      }
    }

    function keyToInput(key, isDown) {
      switch (key) {
        case "ArrowUp": case "w": case "W": move.up = isDown; if (isDown) pressAction("up"); break;
        case "ArrowDown": case "s": case "S": move.down = isDown; if (isDown) pressAction("down"); break;
        case "ArrowLeft": move.left = isDown; if (isDown) pressAction("left"); break;
        case "ArrowRight": move.right = isDown; if (isDown) pressAction("right"); break;
        case "a": case "A": keyHeld.a = isDown; if (isDown) { aPressedFrame = true; pressAction("a"); } break;
        case "b": case "B": keyHeld.b = isDown; if (isDown) { bPressedFrame = true; pressAction("b"); } break;
        case "Enter": if (isDown) pressAction("start"); break;
        case "Shift": if (isDown) pressAction("select"); break;
      }
    }

    window.addEventListener("keydown", function (e) { initAudio(); keyToInput(e.key, true); });
    window.addEventListener("keyup", function (e) { keyToInput(e.key, false); });

    function maybeLangToggle(action) {
      if (action === "select" && state !== "PLAYING" && state !== "SPLASH") {
        toggleLang(); playSound(700, "square", 0.06); return true;
      }
      return false;
    }

    function teamTypeItems() {
      const items = ["nationals", "clubs"];
      if (hasSavedGame) items.push("loadChampionship");
      return items;
    }

    function navTeamType(action) {
      if (maybeLangToggle(action)) return;
      const items = teamTypeItems();
      if (action === "up") { menuIndex--; playSound(400, "square", 0.04); }
      else if (action === "down") { menuIndex++; playSound(400, "square", 0.04); }
      else if (action === "a") {
        const choice = items[(menuIndex + items.length) % items.length];
        if (choice === "nationals") { teamType = "national"; teamPool = NATIONAL_TEAMS; playSound(650, "square", 0.08); state = "TEAM_SELECT"; menuIndex = 0; }
        else if (choice === "clubs") { teamType = "club"; teamPool = CLUB_TEAMS; playSound(650, "square", 0.08); state = "TEAM_SELECT"; menuIndex = 0; }
        else if (choice === "loadChampionship") {
          if (loadChampionship()) { playSound(880, "triangle", 0.12); matchMode = "championship"; state = "PRERACE"; preraceIndex = 0; }
        }
      }
      if (menuIndex < 0) menuIndex = items.length - 1;
      if (menuIndex >= items.length) menuIndex = 0;
    }

    function navTeam(action) {
      if (maybeLangToggle(action)) return;
      const cols = 2;
      const total = teamPool.length;
      if (action === "left") { menuIndex--; playSound(400, "square", 0.04); }
      else if (action === "right") { menuIndex++; playSound(400, "square", 0.04); }
      else if (action === "up") { menuIndex -= cols; playSound(400, "square", 0.04); }
      else if (action === "down") { menuIndex += cols; playSound(400, "square", 0.04); }
      else if (action === "a") { playerTeamIndex = menuIndex; playerTeam = teamPool[menuIndex]; playSound(650, "square", 0.08); state = "MENU"; menuIndex = 0; }
      else if (action === "b") { state = "TEAMTYPE_SELECT"; menuIndex = (teamType === "national") ? 0 : 1; }
      if (menuIndex < 0) menuIndex += total;
      if (menuIndex >= total) menuIndex -= total;
    }

    function menuMainItems() { return ["championship", "singleMatch"]; }

    function navMainMenu(action) {
      if (maybeLangToggle(action)) return;
      const len = menuMainItems().length;
      if (action === "up") { menuIndex--; playSound(400, "square", 0.04); }
      else if (action === "down") { menuIndex++; playSound(400, "square", 0.04); }
      else if (action === "a") { selectMainMenu(); }
      else if (action === "b") { state = "TEAM_SELECT"; menuIndex = playerTeamIndex; }
      clampMenuIndex(len);
    }

    function selectMainMenu() {
      playSound(650, "square", 0.08);
      const choice = menuMainItems()[menuIndex];
      if (choice === "championship") {
        matchMode = "championship"; championshipRound = 0;
        buildChampionshipSchedule(); initChampionshipStandings();
        state = "PRERACE"; preraceIndex = 0;
      } else if (choice === "singleMatch") { matchMode = "single"; state = "OPPONENT_SELECT"; menuIndex = 0; }
    }

    function opponentList() {
      const out = [];
      for (let i = 0; i < teamPool.length; i++) { if (i !== playerTeamIndex) out.push(i); }
      return out;
    }

    function navOpponent(action) {
      if (maybeLangToggle(action)) return;
      const list = opponentList();
      if (action === "up") { menuIndex--; playSound(400, "square", 0.04); }
      else if (action === "down") { menuIndex++; playSound(400, "square", 0.04); }
      else if (action === "a") {
        playSound(650, "square", 0.08);
        seedRng(Date.now() >>> 0);
        pendingOpp = list[(menuIndex + list.length) % list.length];
        pendingHome = true;
        openFormationSelect();
      } else if (action === "b") { state = "MENU"; menuIndex = 1; }

    function openFormationSelect() {
      const idx = FORMATION_NAMES.indexOf(playerFormation);

    }

    function navFormation(action) {
      if (maybeLangToggle(action)) return;
      if (action === "up") { formationIndex--; playSound(400, "square", 0.04); }
      else if (action === "down") { formationIndex++; playSound(400, "square", 0.04); }
      else if (action === "a") {
        playSound(650, "square", 0.08);
        playerFormation = FORMATION_NAMES[(formationIndex + FORMATION_NAMES.length) % FORMATION_NAMES.length];

      } else if (action === "b") {

      }
      if (formationIndex < 0) formationIndex = FORMATION_NAMES.length - 1;
      if (formationIndex >= FORMATION_NAMES.length) formationIndex = 0;
    }

    function preraceItems() { return ["startMatch", "viewStandings", "saveChampionship", "exitToMenu"]; }
    function currentFixture() { return championshipSchedule[championshipRound]; }

    function navPrerace(action) {
      if (maybeLangToggle(action)) return;
      const items = preraceItems();
      if (action === "up") { preraceIndex--; playSound(400, "square", 0.04); }
      else if (action === "down") { preraceIndex++; playSound(400, "square", 0.04); }
      else if (action === "a") {
        const choice = items[(preraceIndex + items.length) % items.length];
        if (choice === "startMatch") {
          playSound(650, "square", 0.08);
          const fx = currentFixture();
          seedRng((Date.now() ^ (championshipRound * 2654435761)) >>> 0);
          pendingOpp = fx.opponent;
          pendingHome = fx.home;
          openFormationSelect();
        } else if (choice === "viewStandings") { playSound(500, "square", 0.06); state = "STANDINGS"; standingsReturn = "PRERACE"; }
        else if (choice === "saveChampionship") { saveChampionship(); playSound(880, "triangle", 0.15); saveFlashMs = 1500; }
        else if (choice === "exitToMenu") { playSound(250, "square", 0.12); backToMenu(); }
      }
      if (preraceIndex < 0) preraceIndex = items.length - 1;
      if (preraceIndex >= items.length) preraceIndex = 0;
    }

    function openPause() { state = "PAUSE"; pauseIndex = 0; playSound(300, "square", 0.1); updateCrowdSound(0); }

    function pauseItems() {
      if (matchMode === "championship") { return ["resume", "saveAndExit", "exitToMenu"]; }
      return ["resume", "exitToMenu"];
    }

    function navPause(action) {
      const items = pauseItems();
      if (action === "select") { showInfoOverlay = !showInfoOverlay; playSound(500, "square", 0.05); return; }
      if (action === "up") { pauseIndex--; playSound(400, "square", 0.04); }
      else if (action === "down") { pauseIndex++; playSound(400, "square", 0.04); }
      else if (action === "a" || action === "start") {
        const choice = items[(pauseIndex + items.length) % items.length];
        if (choice === "resume") { state = "PLAYING"; showInfoOverlay = false; playSound(500, "square", 0.1); }
        else if (choice === "saveAndExit") { saveChampionship(); playSound(880, "triangle", 0.15); saveFlashMs = 1500; showInfoOverlay = false; state = "PRERACE"; preraceIndex = 0; }
        else if (choice === "exitToMenu") { showInfoOverlay = false; backToMenu(); }
      }
      if (pauseIndex < 0) pauseIndex = items.length - 1;
      if (pauseIndex >= items.length) pauseIndex = 0;
    }

    function backToMenu() {
      playSound(250, "square", 0.15);
      updateCrowdSound(0);
      if (matchMode === "championship" && championshipRound < CHAMP_TOTAL) {
        state = "STANDINGS"; standingsReturn = "MENU"; return;
      }
      state = "MENU"; menuIndex = 0; matchMode = "single";
    }

    function goToMainMenu() { state = "MENU"; menuIndex = 0; matchMode = "single"; }

    function clampMenuIndex(len) {
      if (menuIndex < 0) menuIndex = len - 1;
      if (menuIndex >= len) menuIndex = 0;
    }

    function bindButton(id, options) {
      const btn = document.getElementById(id);
      if (!btn) return;
      const moveKey = options.move;
      const action = options.action;
      function onPress(e) {
        if (e && e.cancelable) e.preventDefault();
        initAudio();
        btn.classList.add("active");
        if (moveKey) move[moveKey] = true;
        if (id === "btn-a") { keyHeld.a = true; aPressedFrame = true; }
        if (id === "btn-b") { keyHeld.b = true; bPressedFrame = true; }
        if (action) pressAction(action);
      }
      function onRelease(e) {
        if (e && e.cancelable) e.preventDefault();
        btn.classList.remove("active");
        if (moveKey) move[moveKey] = false;
        if (id === "btn-a") keyHeld.a = false;
        if (id === "btn-b") keyHeld.b = false;
      }
      btn.addEventListener("touchstart", onPress, { passive: false });
      btn.addEventListener("touchend", onRelease, { passive: false });
      btn.addEventListener("touchcancel", onRelease, { passive: false });
      btn.addEventListener("mousedown", onPress);
      btn.addEventListener("mouseup", onRelease);
      btn.addEventListener("mouseleave", onRelease);
    }

    bindButton("btn-up", { action: "up", move: "up" });
    bindButton("btn-down", { action: "down", move: "down" });
    bindButton("btn-left", { action: "left", move: "left" });
    bindButton("btn-right", { action: "right", move: "right" });
    bindButton("btn-a", { action: "a" });
    bindButton("btn-b", { action: "b" });
    bindButton("btn-select", { action: "select" });
    bindButton("btn-start", { action: "start" });

    function fmtTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) + amt;
      let g = ((n >> 8) & 255) + amt;
      let b = (n & 255) + amt;
      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));
      return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
    }

    function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }

    function wrapText(text, x, y, maxWidth, lineHeight) {
      const words = text.split(" ");
      let line = "";
      const lines = [];
      for (let n = 0; n < words.length; n++) {
        const test = line + words[n] + " ";
        if (ctx.measureText(test).width > maxWidth && line !== "") { lines.push(line.trim()); line = words[n] + " "; }
        else { line = test; }
      }
      lines.push(line.trim());
      for (let i = 0; i < lines.length; i++) { ctx.fillText(lines[i], x, y + i * lineHeight); }
    }

    function update(dt) {
      if (saveFlashMs > 0) saveFlashMs -= dt;
      if (crowdRoarMs > 0) {
        crowdRoarMs -= dt;
        if (crowdRoarMs <= 0) { crowdRoarMs = 0; updateCrowdSound(0.3); }
      }
      if (state === "SPLASH" || state === "PODIUM") { splashTime += dt; return; }
      if (state === "COUNTDOWN") {
        countdownMs -= dt;
        updateCrowdSound(0);
        if (countdownMs <= 0) { state = "PLAYING"; playWhistle(); }
        aPressedFrame = false; bPressedFrame = false;
        return;
      }
      if (state === "HALFTIME") {
        aPressedFrame = false; bPressedFrame = false;
        return;
      }
      if (state === "PLAYING") {
        if (goalFlashMs > 0) {
          goalFlashMs -= dt;
          if (goalFlashMs <= 0) { resetFormation(kickoffTeam); }
          aPressedFrame = false; bPressedFrame = false;
          return;
        }
        updateMatch(dt);
        aPressedFrame = false; bPressedFrame = false;
        return;
      }
      updateCrowdSound(0);
      aPressedFrame = false; bPressedFrame = false;
    }

    const VIEW = { top: 30, bottom: 300, farScale: 0.42, nearScale: 1.0, cx: 160 };

    function worldToScreen(wx, wy) {
      const depth = wy / FIELD_H;
      const scale = VIEW.farScale + (VIEW.nearScale - VIEW.farScale) * depth;
      const sy = VIEW.top + (VIEW.bottom - VIEW.top) * depth;
      const halfW = 158 * scale;
      const sx = VIEW.cx + ((wx / FIELD_W) - 0.5) * 2 * halfW;
      return { x: sx, y: sy, scale: scale };
    }

    function draw() {
      switch (state) {
        case "SPLASH": return drawSplash();
        case "TEAMTYPE_SELECT": return drawTeamTypeSelect();
        case "TEAM_SELECT": return drawTeamSelect();
        case "MENU": return drawMenu();
        case "OPPONENT_SELECT": return drawOpponentSelect();
        case "FORMATION_SELECT": return drawFormationSelect();
        case "PRERACE": return drawPrerace();
        case "STANDINGS": return drawStandings();
        case "PODIUM": return drawPodium();
      }
      drawScene();
      if (state === "COUNTDOWN") drawCountdown();
      if (state === "HALFTIME") drawHalfTime();
      if (state === "PAUSE") { if (showInfoOverlay) drawInfoOverlay(true); else drawPause(); }
      if (state === "FULLTIME") drawFullTime();
      if (goalFlashMs > 0 && state === "PLAYING") drawGoalFlash();
      if (showInfoOverlay && state === "PLAYING") drawInfoOverlay(false);
    }

    function drawScene() {
      drawStands();
      drawPitch();
      drawSideStands();
      drawGoal(0);
      drawGoal(FIELD_H);
      const ents = [];
      for (let i = 0; i < players.length; i++) {
        ents.push({ y: players[i].y, kind: "player", ref: players[i], idx: i });
      }
      ents.push({ y: ball.y, kind: "ball", ref: ball });
      ents.sort(function (a, b) { return a.y - b.y; });
      ents.forEach(function (e) {
        if (e.kind === "player") { drawFootballer(e.ref, e.idx === controlledIdx && e.ref.team === 0); }
        else { drawBall(e.ref); }
      });
      drawHUD();
    }

    function drawStands() {
      const grad = ctx.createLinearGradient(0, 0, 0, VIEW.top);
      grad.addColorStop(0, "#6ab0e8");
      grad.addColorStop(1, "#b8dcf4");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 320, VIEW.top);
      px(0, VIEW.top - 26, 320, 26, "#33323a");
      for (let i = 0; i < 160; i++) {
        const sx = (i * 79) % 320;
        const sy = VIEW.top - 24 + ((i * 37) % 22);
        const cols = ["#c85a5a", "#5a7ac8", "#d8c85a", "#e8e8e8", "#5ac87a"];
        px(sx, sy, 2, 2, cols[i % cols.length]);
      }
      px(0, VIEW.top - 3, 320, 3, "#e8e8e8");
    }

    function drawSideStands() {
      const cols = ["#d85a5a", "#5a7ac8", "#e8d85a", "#f0f0f0", "#5ac87a", "#e0902a", "#c060c0"];
      const top = VIEW.top;
      const bot = VIEW.bottom;
      const wob = Math.floor(splashTime / 350) % 2;
      for (let side = 0; side < 2; side++) {
        for (let sy = top; sy < bot; sy += 4) {
          const depth = (sy - top) / (bot - top);
          const leftEdge = worldToScreen(0, depth * FIELD_H).x;
          const rightEdge = worldToScreen(FIELD_W, depth * FIELD_H).x;
          let x0, x1;
          if (side === 0) { x1 = leftEdge - 16; x0 = 0; }
          else { x1 = 320; x0 = rightEdge + 16; }
          if (x1 - x0 < 3) continue;
          const grad = (Math.floor(sy / 8) % 2 === 0) ? "#34333d" : "#2b2a33";
          px(x0, sy, x1 - x0, 4, grad);
          for (let x = x0 + 2; x < x1 - 2; x += 5) {
            const c = cols[((x * 3 + sy + wob) >>> 0) % cols.length];
            px(x, sy + ((x + sy) % 2 ? 1 : 0), 3, 3, c);
          }
        }
        for (let sy = top; sy < bot; sy += 2) {
          const depth = (sy - top) / (bot - top);
          const edge = (side === 0)
            ? worldToScreen(0, depth * FIELD_H).x - 10
            : worldToScreen(FIELD_W, depth * FIELD_H).x + 8;
          px(edge, sy, 2, 2, "#c8ccd4");
        }
      }
    }

    function drawPitch() {
      const rows = 16;
      const margin = 10;
      for (let r = 0; r < rows; r++) {
        const d0 = r / rows;
        const d1 = (r + 1) / rows;
        const yTop = VIEW.top + (VIEW.bottom - VIEW.top) * d0;
        const yBot = VIEW.top + (VIEW.bottom - VIEW.top) * d1;
        const left = worldToScreen(0, d0 * FIELD_H).x - margin;
        const right = worldToScreen(FIELD_W, d0 * FIELD_H).x + margin;
        const light = (r % 2 === 0);
        ctx.fillStyle = light ? "#2fa845" : "#279a3d";
        ctx.fillRect(left, yTop, right - left, yBot - yTop + 1);
      }
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 2;
      const tl = worldToScreen(0, 0);
      const tr = worldToScreen(FIELD_W, 0);
      const br = worldToScreen(FIELD_W, FIELD_H);
      const bl = worldToScreen(0, FIELD_H);
      ctx.beginPath();
      ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
      ctx.closePath(); ctx.stroke();
      const cm0 = worldToScreen(0, FIELD_H / 2);
      const cm1 = worldToScreen(FIELD_W, FIELD_H / 2);
      ctx.beginPath(); ctx.moveTo(cm0.x, cm0.y); ctx.lineTo(cm1.x, cm1.y); ctx.stroke();
      const c = worldToScreen(FIELD_W / 2, FIELD_H / 2);
      ctx.beginPath(); ctx.ellipse(c.x, c.y, 40 * c.scale, 16 * c.scale, 0, 0, Math.PI * 2); ctx.stroke();
      drawPenaltyBox(0);
      drawPenaltyBox(FIELD_H);
      ctx.lineWidth = 1;
    }

    function drawPenaltyBox(goalY) {
      const dir = (goalY === 0) ? 1 : -1;
      const boxDepth = FIELD_H * 0.11;
      const x1 = FIELD_W / 2 - GOAL_W / 2 - 30;
      const x2 = FIELD_W / 2 + GOAL_W / 2 + 30;
      const yIn = goalY + dir * boxDepth;
      const a = worldToScreen(x1, goalY);
      const b = worldToScreen(x1, yIn);
      const cc = worldToScreen(x2, yIn);
      const d = worldToScreen(x2, goalY);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(cc.x, cc.y); ctx.lineTo(d.x, d.y);
      ctx.stroke();
    }

    function drawGoal(goalY) {
      const xL = FIELD_W / 2 - GOAL_W / 2;
      const xR = FIELD_W / 2 + GOAL_W / 2;
      const postL = worldToScreen(xL, goalY);
      const postR = worldToScreen(xR, goalY);
      const postH = 20 * postL.scale;
      const dir = (goalY === 0) ? -1 : 1;
      const depth = 10 * postL.scale;
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1;
      for (let k = 0; k <= 6; k++) {
        const xx = xL + (xR - xL) * (k / 6);
        const p = worldToScreen(xx, goalY);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - postH);
        ctx.lineTo(p.x, p.y - postH + dir * depth * 0.4 + depth * 0.6);
        ctx.stroke();
      }
      for (let k = 0; k <= 2; k++) {
        const yy = -postH + (postH) * (k / 2);
        ctx.beginPath();
        ctx.moveTo(postL.x, postL.y + yy);
        ctx.lineTo(postR.x, postR.y + yy);
        ctx.stroke();
      }
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(postL.x, postL.y);
      ctx.lineTo(postL.x, postL.y - postH);
      ctx.lineTo(postR.x, postR.y - postH);
      ctx.lineTo(postR.x, postR.y);
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    function drawFootballer(p, isControlled) {
      const s = worldToScreen(p.x, p.y);
      const u = s.scale * 0.44;
      const cx = s.x;
      const footY = s.y;
      const kit = (p.role === "gk") ? GK_KIT : teamKit(p.team);
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.beginPath();
      ctx.ellipse(cx, footY, 8 * u, 3 * u, 0, 0, Math.PI * 2);
      ctx.fill();
      if (isControlled && slide.active) {
        const dirX = (lastDir.x >= 0) ? 1 : -1;
        px(cx - 10 * u, footY - 8 * u, 20 * u, 7 * u, kit.c1);
        px(cx + dirX * 8 * u, footY - 9 * u, 8 * u, 4 * u, kit.short);
        px(cx + dirX * 15 * u, footY - 9 * u, 4 * u, 3 * u, "#1a1a1a");
        px(cx - dirX * 10 * u, footY - 12 * u, 6 * u, 6 * u, "#e8b890");
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        for (let d = 0; d < 3; d++) {
          px(cx - dirX * (12 + d * 4) * u, footY - 2 * u, 2, 2, "rgba(230,230,210,0.5)");
        }
        return;
      }
      if (isControlled && Math.floor(splashTime / 200) % 2 === 0) {
        ctx.fillStyle = "#ffe23a";
        const ay = footY - 44 * u;
        ctx.beginPath();
        ctx.moveTo(cx, ay + 8);
        ctx.lineTo(cx - 5, ay);
        ctx.lineTo(cx + 5, ay);
        ctx.closePath();
        ctx.fill();
      }
      px(cx - 5 * u, footY - 14 * u, 4 * u, 10 * u, kit.sock);
      px(cx + 1 * u, footY - 14 * u, 4 * u, 10 * u, kit.sock);
      px(cx - 6 * u, footY - 20 * u, 5 * u, 8 * u, kit.short);
      px(cx + 1 * u, footY - 20 * u, 5 * u, 8 * u, kit.short);
      px(cx - 6 * u, footY - 4 * u, 5 * u, 3 * u, "#1a1a1a");
      px(cx + 1 * u, footY - 4 * u, 5 * u, 3 * u, "#1a1a1a");
      drawShirt(cx, footY - 32 * u, 12 * u, 14 * u, kit);
      px(cx - 8 * u, footY - 31 * u, 2 * u, 9 * u, kit.c1);
      px(cx + 6 * u, footY - 31 * u, 2 * u, 9 * u, kit.c1);
      px(cx - 3 * u, footY - 40 * u, 6 * u, 6 * u, "#e8b890");
      px(cx - 3 * u, footY - 40 * u, 6 * u, 2 * u, "#3a2a1a");
    }

    function drawShirt(x, y, w, h, kit) {
      const left = x - w / 2;
      if (kit.pattern === "vstripe") {
        const stripes = 4;
        const sw = w / stripes;
        for (let i = 0; i < stripes; i++) {
          ctx.fillStyle = (i % 2 === 0) ? kit.c1 : kit.c2;
          ctx.fillRect(left + i * sw, y, Math.ceil(sw), h);
        }
      } else if (kit.pattern === "hstripe") {
        const stripes = 3;
        const sh = h / stripes;
        for (let i = 0; i < stripes; i++) {
          ctx.fillStyle = (i % 2 === 0) ? kit.c1 : kit.c2;
          ctx.fillRect(left, y + i * sh, w, Math.ceil(sh));
        }
      } else {
        ctx.fillStyle = kit.c1;
        ctx.fillRect(left, y, w, h);
      }
      ctx.fillStyle = shade(kit.c1, -30);
      ctx.fillRect(x - 2, y, 4, 2);
    }

    function drawBall(b) {
      const s = worldToScreen(b.x, b.y);
      const r = 1.5 * s.scale;
      const bx = s.x;
      const speed = Math.hypot(b.vx || 0, b.vy || 0);
      const lift = b.high ? Math.min(10, speed * 0.6) * s.scale : 2 * s.scale;
      const by = s.y - lift;
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, r, r * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      const rr = b.high ? r * 1.25 : r;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(bx, by, rr, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(bx, by, rr * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
